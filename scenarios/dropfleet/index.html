<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dropfleet Commander: Scenarios</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://type37.github.io/dropfleet-builder/scenarios/dropfleet/">
<meta property="og:title" content="Dropfleet Commander Scenarios">
<meta property="og:description" content="Every published Dropfleet Commander scenario with its map and every rule it names explained, verbatim from the books.">
<meta property="og:image" content="https://type37.github.io/dropfleet-builder/assets/og/scenario-generator.png">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Libre+Baskerville:ital@0;1&family=Roboto+Slab:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="scenario-card.css">
<style>
@font-face{font-family:'Terminal Grotesque Open';src:url('../../assets/fonts/terminal-grotesque-open.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
:root{
  --navy:#0a1e2e;--navy-ink:#c9d6de;--page:#fbf9f4;--hover:#efe9dc;
  --ink:#0E0C08;--muted:#5d5850;--action:#0072a8;--action-dk:#005b85;--focus:#B86C0A;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--page);}
body{font-family:'Jost',system-ui,sans-serif;color:var(--ink);background:var(--page);min-height:100vh;display:flex;flex-direction:column;}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
svg.i{width:18px;height:18px;flex:0 0 18px;}

/* Header */
.top{background:var(--navy);color:var(--navy-ink);}
.top-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;}
.top a{color:var(--navy-ink);text-decoration:none;font-size:.92rem;}
.top a:hover{color:#fff;}
.top-logo img{height:40px;width:auto;display:block;}
.top-gen{justify-self:end;display:inline-flex;align-items:center;gap:8px;}

main{flex:1;width:100%;}

/* Index */
.idx{max-width:1180px;margin:0 auto;padding:28px 20px 48px;}
.idx-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px 24px;margin-bottom:8px;}
.idx-h{font-family:'Roboto Slab',Georgia,serif;font-weight:700;font-size:2rem;line-height:1.1;}
.idx-tools{display:flex;gap:8px;flex-wrap:wrap;}
.idx-tools input{font:inherit;font-size:1rem;color:var(--ink);background:#fff;border:1.5px solid #8a8378;padding:8px 12px;width:240px;max-width:100%;}
.btn{font-family:'Jost',system-ui,sans-serif;font-size:.95rem;font-weight:600;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1.5px solid var(--action);background:var(--action);color:#fff;cursor:pointer;}
.btn:hover{background:var(--action-dk);border-color:var(--action-dk);}
.book{margin-top:30px;}
.book-h{display:flex;align-items:center;gap:8px;font-family:'Roboto Slab',Georgia,serif;font-weight:700;font-size:1.25rem;margin-bottom:10px;}
.book-h svg{width:14px;height:14px;flex:0 0 14px;}
.scn-list{list-style:none;}
.scn,.scn-cols{display:grid;grid-template-columns:72px minmax(170px,1.3fr) minmax(110px,.7fr) minmax(140px,1fr) minmax(160px,1.1fr);gap:16px;align-items:center;}
.scn-cols{padding:0 8px 4px;margin:0 -8px;font-size:.8rem;color:var(--muted);}
.scn-cols span:first-child{grid-column:2;}
.scn{padding:8px;margin:0 -8px;color:inherit;text-decoration:none;}
.scn:hover{background:var(--hover);}
.scn-map{width:72px;height:72px;display:block;background:#e6dfcf;border:1px solid #cdbf98;object-fit:cover;}
.scn-name{font-family:'Roboto Slab',Georgia,serif;font-weight:600;font-size:1.05rem;line-height:1.25;}
.scn-f{font-size:.9rem;line-height:1.35;color:var(--ink);}
.scn-f span{display:block;}
.scn-f .scn-fl{display:none;}

/* Scenario view */
.bar{position:sticky;top:0;z-index:20;background:var(--page);box-shadow:0 6px 14px -10px rgba(14,12,8,.35);}
.bar-in{max-width:10in;margin:0 auto;padding:8px 14mm;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;}
.bar-back{color:var(--action-dk);text-decoration:none;font-weight:500;}
.bar-back:hover{text-decoration:underline;}
.acts{justify-self:end;display:flex;gap:4px;}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;background:transparent;border:1.5px solid transparent;color:var(--ink);cursor:pointer;}
.icon-btn:hover{border-color:#8a8378;}
.trk{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;}
.trk-g{display:flex;align-items:center;gap:4px;}
.trk-l{font-size:.85rem;color:var(--muted);margin-right:4px;white-space:nowrap;}
.trk button{width:32px;height:32px;display:grid;place-items:center;background:#fff;border:1.5px solid #8a8378;color:var(--ink);font:600 1rem 'Jost',sans-serif;cursor:pointer;}
.trk button:hover{border-color:var(--ink);}
.trk output{min-width:2.2ch;text-align:center;font-family:'Roboto Slab',Georgia,serif;font-weight:700;font-size:1.1rem;display:inline-flex;align-items:center;justify-content:center;gap:3px;}
.trk output .vp-dm{width:9px;height:9px;}
.trk .trk-plain{width:auto;padding:0 10px;font-size:.85rem;font-weight:500;}
.sheet{max-width:10in;margin:0 auto;padding:4mm 0 10mm;}
.sheet .pub-fauna{font-family:'Jost',system-ui,sans-serif;font-size:.95rem;font-weight:600;padding:7px 12px;border:1.5px solid var(--action);background:transparent;color:var(--action-dk);cursor:pointer;}
.sheet .pub-fauna:hover{background:var(--action);color:#fff;}

/* Footer */
.foot{background:#f3f1ec;padding:10px 20px;font-size:.78rem;color:#5d5850;}
.foot-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;max-width:1180px;margin:0 auto;}
.foot b{font-family:'Roboto Slab',Georgia,serif;font-weight:700;color:#3a3834;}
.foot a{color:#1b3a5c;text-decoration:none;}
.foot a:hover{text-decoration:underline;}
.foot-by{margin-left:auto;}
.warlore-mark{display:inline-block;font-family:'Terminal Grotesque Open','Roboto Slab',serif;font-size:15px;line-height:1.3;padding:1px 6px;text-decoration:none;color:#FFCC00 !important;background:#000;}
.warlore-mark:hover{color:#000 !important;background:#FFCC00;text-decoration:none !important;}

@media (max-width:700px){
  .top-in{grid-template-columns:auto 1fr;padding:8px 14px;}
  .top-logo{display:none;}
  .idx{padding:20px 14px 40px;}
  .scn-cols{display:none;}
  .scn{grid-template-columns:64px minmax(0,1fr);gap:4px 12px;align-items:start;}
  .scn-map{width:64px;height:64px;grid-row:span 4;}
  .scn-f{display:flex;flex-wrap:wrap;gap:0 6px;font-size:.86rem;}
  .scn-f span{display:inline;}
  .scn-f .scn-fl{display:inline;color:var(--muted);}
  .idx-tools{width:100%;}
  .idx-tools input{flex:1;width:auto;}
  .bar-in{grid-template-columns:1fr auto;padding:6px 3mm;}
  /* the tracker sits at the bottom, in thumb reach */
  .trk{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);color:#fff;padding:8px 12px calc(8px + env(safe-area-inset-bottom));justify-content:center;}
  .trk .trk-l{color:var(--navy-ink);}
  .trk button{width:40px;height:40px;background:transparent;border-color:#6f8797;color:#fff;}
  .trk .trk-plain{width:auto;}
  body.has-trk{padding-bottom:var(--trk-h,64px);}
  .foot-by{margin-left:0;}
}
@media print{
  @page{size:letter;margin:10mm;}
  .top,.bar,.foot{display:none !important;}
  body{background:#fff;}
  body.has-trk{padding-bottom:0;}
  .sheet{max-width:none;padding:0;}
  .sheet .pub-fauna{display:none;}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a href="../../index.html">← Fleet Builder</a>
    <a class="top-logo" href="#"><img src="../../assets/logos/dfc_logo.webp" alt="Dropfleet Commander scenarios"></a>
    <a class="top-gen" href="generator/"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17"/><circle cx="8.3" cy="8.3" r="1.5" fill="currentColor" stroke="none"/><circle cx="15.7" cy="8.3" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="8.3" cy="15.7" r="1.5" fill="currentColor" stroke="none"/><circle cx="15.7" cy="15.7" r="1.5" fill="currentColor" stroke="none"/></svg>Scenario Generator</a>
  </div>
</header>
<main id="app"></main>
<footer class="foot">
  <div class="foot-in">
    <b>Dropfleet Commander</b>
    <span>by <a href="https://www.ttcombat.com/games/dropfleet-commander" target="_blank" rel="noopener">TTCombat</a></span>
    <a href="../../index.html">Fleet Builder</a>
    <a href="../../ref/index.html" target="_blank" rel="noopener">Faction References</a>
    <span class="foot-by">Scenarios by <a class="warlore-mark" href="https://linktr.ee/warlore" target="_blank" rel="noopener" title="WarLore">War<span>Lore</span></a></span>
    <a href="https://type37.github.io/dropzone-3e-army-builder/" target="_blank" rel="noopener">Dropzone</a>
    <a href="mailto:warlore1@outlook.com">Send Feedback</a>
    <a href="https://github.com/Type37/dropfleet-builder" target="_blank" rel="noopener">Source on GitHub</a>
  </div>
</footer>

<script src="scenario-terms.js"></script>
<script src="scenario-lib.js"></script>
<script src="scenario-hotspots.js"></script>
<script>
const BOOKS=['Rulebook','Scenario Expansion 1','Civilian Ships & Scenarios'];
const ICON={
  die:'<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17"/><circle cx="8.3" cy="8.3" r="1.5" fill="currentColor" stroke="none"/><circle cx="15.7" cy="8.3" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="8.3" cy="15.7" r="1.5" fill="currentColor" stroke="none"/><circle cx="15.7" cy="15.7" r="1.5" fill="currentColor" stroke="none"/></svg>',
  share:'<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v8h14v-8"/></svg>',
  done:'<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  print:'<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 9V3h10v6M7 17H4v-8h16v8h-3M7 14h10v7H7z"/></svg>',
  diamond:'<svg viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,1 15,8 8,15 1,8" fill="none" stroke="#B8952F" stroke-width="1.5"/><polygon points="8,5 11,8 8,11 5,8" fill="#B8952F" opacity="0.28"/></svg>',
};
const app=document.getElementById('app');
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let query='';

/* The Fauna button inside a scenario opens the Fauna rules */
function pubOpen(id){ location.hash=id; }

/* Short facts for the index, named as the books name them, in the order the text uses them */
const DEP=[['Close Enough',/\bClose Enough\b/],['Column',/\bColumn\b/],['Standoff',/\bStandoff\b/],['Imminent',/\bImminent\b/],['Staggered',/\bStaggered\b/],['Backline',/\bBackline\b/],['Directly Deploy',/\bDirectly Deploy/],['Close',/\bClose\b(?! Enough)/],['Distant',/\bDistant\b/]];
const SCORE=[['Standard Scoring',/\bStandard Scoring\b/],['Normal Scoring',/\bNormal Scoring\b/],['Demolish Scoring',/\bDemolish/],['Focal Points',/\bFocal [Pp]oint/],['Kill Points',/\bKill Points\b/],['Assess',/\bAssess/],...OB.map(o=>[o.name,new RegExp('\\b'+o.name+'\\b')])];
function found(text,list){
  return list.map(([n,re])=>({n,m:text.match(re)})).filter(x=>x.m).sort((a,b)=>a.m.index-b.m.index).map(x=>x.n);
}
function facts(s){
  const p=pubJoin(s.players).trim().replace(/\.$/,'');
  const n=p.match(/^(\d(?:-\d)?)(?: players)?$/i);
  const players=n?n[1]:(/attacker/i.test(p)&&/defender/i.test(p)?'Attacker and defender':'');
  const uniq=a=>a.filter((x,i)=>a.indexOf(x)===i);
  return {players, dep:uniq(found(pubJoin(s.deployment),DEP)), score:uniq(found([s.scoring,s.special,s.variant].map(pubJoin).join(' '),SCORE))};
}
const factCell=(label,vals)=>`<span class="scn-f">${vals.length?`<span class="scn-fl">${label}</span>`:''}${vals.map(v=>`<span>${v}</span>`).join('')}</span>`;

/* ── Index ─────────────────────────────────────────────────────────────── */
function books(){
  const q=query.trim().toLowerCase();
  return BOOKS.map(book=>{
    const list=SCENARIOS.filter(s=>s.src===book).filter(s=>{ if(!q) return true; const f=facts(s); return [s.name,f.players,...f.dep,...f.score].join(' ').toLowerCase().includes(q); });
    if(!list.length) return '';
    return `<section class="book"><h2 class="book-h">${ICON.diamond}${book}</h2>
      <div class="scn-cols" aria-hidden="true"><span>Scenario</span><span>Players</span><span>Deployment</span><span>Scoring</span></div>
      <ul class="scn-list">${list.map(s=>{ const f=facts(s); return `<li><a class="scn" href="#${s.id}">${SCENARIO_MAPS.has(s.id)?`<img class="scn-map" src="${SCN_ASSETS}scenarios/dropfleet/thumb/${s.id}.webp" alt="" loading="lazy" width="72" height="72">`:'<span class="scn-map"></span>'}<span class="scn-name">${s.name}</span>${factCell('Players',f.players?[f.players]:[])}${factCell('Deployment',f.dep)}${factCell('Scoring',f.score)}</a></li>`; }).join('')}</ul></section>`;
  }).join('');
}
function renderIndex(){
  document.title='Dropfleet Commander: Scenarios';
  document.body.classList.remove('has-trk');
  app.innerHTML=`<div class="idx">
    <div class="idx-head">
      <h1 class="idx-h">Scenarios</h1>
      <div class="idx-tools">
        <input id="q" type="search" placeholder="Search" aria-label="Search scenarios" autocomplete="off" value="${esc(query)}">
        <button class="btn" id="rand">${ICON.die}Random</button>
      </div>
    </div>
    <div id="books">${books()}</div>
  </div>`;
  document.getElementById('q').addEventListener('input',e=>{ query=e.target.value; document.getElementById('books').innerHTML=books(); });
  document.getElementById('rand').addEventListener('click',()=>{
    const pool=SCENARIOS.filter(s=>SCENARIO_MAPS.has(s.id));
    location.hash=pool[Math.floor(Math.random()*pool.length)].id;
  });
}

/* ── Game tracker: round and VP, kept per scenario on this device ─────── */
const trackKey=id=>'dfc-scenario-track:'+id;
function loadTrack(id){
  try{ const t=JSON.parse(localStorage.getItem(trackKey(id))); if(t&&Array.isArray(t.vp)) return t; }catch(e){}
  return {round:1,vp:[0,0]};
}
function saveTrack(id,t){ try{ localStorage.setItem(trackKey(id),JSON.stringify(t)); }catch(e){} }
function sizeTrack(){
  const el=document.getElementById('trk');
  if(el) document.documentElement.style.setProperty('--trk-h',el.getBoundingClientRect().height+'px');
}
function drawTrack(s,t){
  const el=document.getElementById('trk'); if(!el) return;
  const text=[s.scoring,s.special,s.variant].map(pubJoin).join(' ');
  const scoresOn46=/\b(Standard|Normal) Scoring\b|\bFocal [Pp]oint/.test(text);
  const mark=scoresOn46&&(t.round===4||t.round===6)?`<svg class="vp-dm" viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,1 15,8 8,15 1,8" fill="#B8952F"/></svg>`:'';
  el.innerHTML=`<div class="trk-g"><span class="trk-l">Round</span><button data-a="r-" aria-label="Previous round">−</button><output aria-live="polite">${t.round}${mark}</output><button data-a="r+" aria-label="Next round">+</button></div>
    ${t.vp.map((v,i)=>`<div class="trk-g"><span class="trk-l">Player ${i+1}</span><button data-a="v-" data-p="${i}" aria-label="Player ${i+1} VP down">−</button><output aria-live="polite">${v}</output><button data-a="v+" data-p="${i}" aria-label="Player ${i+1} VP up">+</button></div>`).join('')}
    ${t.vp.length<4?`<button class="trk-plain" data-a="p+">Add player</button>`:''}
    ${t.vp.length>2?`<button class="trk-plain" data-a="p-">Remove player</button>`:''}
    <button class="trk-plain" data-a="clear">Clear</button>`;
  sizeTrack();
}
function wireTrack(s){
  let t=loadTrack(s.id);
  drawTrack(s,t);
  document.getElementById('trk').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    const a=b.dataset.a, p=b.dataset.p;
    switch(a){
      case 'r-': t.round=Math.max(1,t.round-1); break;
      case 'r+': t.round++; break;
      case 'v-': t.vp[+p]--; break;
      case 'v+': t.vp[+p]++; break;
      case 'p+': if(t.vp.length<4) t.vp.push(0); break;
      case 'p-': if(t.vp.length>2) t.vp.pop(); break;
      case 'clear': t={round:1,vp:t.vp.map(()=>0)}; break;
    }
    saveTrack(s.id,t); drawTrack(s,t);
    const again=document.querySelector(`#trk button[data-a="${a}"]${p!==undefined?`[data-p="${p}"]`:''}`);
    if(again) again.focus();
  });
}

/* ── Scenario ──────────────────────────────────────────────────────────── */
function renderOne(s){
  document.title=`${s.name}: Dropfleet Commander Scenarios`;
  document.body.classList.add('has-trk');
  app.innerHTML=`<div class="bar"><div class="bar-in">
      <a class="bar-back" href="#">← All scenarios</a>
      <div class="trk" id="trk"></div>
      <div class="acts">
        <button class="icon-btn" id="share" aria-label="Share">${ICON.share}</button>
        <button class="icon-btn" id="print" aria-label="Print">${ICON.print}</button>
      </div>
    </div></div>
    <article class="sheet">${renderScenario(s)}</article>`;
  wireTrack(s);
  document.getElementById('print').addEventListener('click',()=>window.print());
  document.getElementById('share').addEventListener('click',async e=>{
    const b=e.currentTarget, url=location.href;
    try{
      if(navigator.share) await navigator.share({title:s.name,url});
      else{
        await navigator.clipboard.writeText(url);
        b.innerHTML=ICON.done; b.setAttribute('aria-label','Link copied');
        setTimeout(()=>{ b.innerHTML=ICON.share; b.setAttribute('aria-label','Share'); },1600);
      }
    }catch(err){}
  });
}

function route(){
  const id=decodeURIComponent(location.hash.slice(1));
  const s=id&&SCENARIOS.find(x=>x.id===id);
  if(s) renderOne(s); else renderIndex();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
window.addEventListener('resize',sizeTrack);
route();
</script>
</body>
</html>
