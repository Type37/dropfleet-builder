<style>
@font-face{font-family:'Terminal Grotesque Open';src:url('../../assets/fonts/terminal-grotesque-open.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
.sheet .pub-fauna{font-family:'Jost',system-ui,sans-serif;font-size:.95rem;font-weight:600;padding:7px 12px;border:1.5px solid var(--action);background:transparent;color:var(--action-dk);cursor:pointer;}
.sheet .pub-fauna:hover{background:var(--action);color:#fff;}
@media print{.sheet .pub-fauna{display:none;}}
/* The Scenario Generator, as a card above the books */
.gen-card{display:inline-grid;grid-template-columns:72px auto;align-items:center;gap:16px;margin-top:24px;padding:10px 24px 10px 10px;background:#fff;border:1.5px solid #cdbf98;color:var(--ink);text-decoration:none;}
.gen-card:hover{background:var(--hover);border-color:#8a6a12;}
.gen-card-ico{width:72px;height:72px;display:grid;place-items:center;background:#0a1e2e;color:#c9d6de;}
.gen-card-ico svg{width:40px;height:40px;}
.gen-card-name{font-family:'Jost',system-ui,sans-serif;font-size:1.25rem;font-weight:600;}
@media print{.gen-card{display:none;}}
/* A scenario at the print type scale needs the room: 3mm margins, as the generator's sheet uses */
@media print{@page{size:letter;margin:3mm;}}
/* The Civilian Ship picker: a ship card under a select of every Civilian Ship */
.pub-civ{grid-column:1/-1;display:grid;gap:3mm;}
.pub-civ-pick{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:'Jost',system-ui,sans-serif;font-size:1rem;font-weight:600;}
.pub-civ-pick select{font:500 1rem 'Jost',system-ui,sans-serif;padding:6px 10px;border:1.5px solid #8a6a12;background:#fff;color:var(--ink);max-width:100%;}
.pub-civ-pick select:focus-visible{outline:2px solid #B86C0A;outline-offset:2px;}
.st-load{margin-top:3mm;}
@media (max-width:600px){.pub-civ .pub-ship{grid-template-columns:minmax(0,1fr);}.pub-civ .pub-ship-art{width:140px;}}
/* a weapon's Special chips wrap inside a narrow column instead of running past the card's edge */
@media (max-width:760px){.pw-special{min-width:0;}.pw-special .pw-chip{white-space:normal;overflow-wrap:anywhere;}}
@media print{.pub-civ-pick{display:none;}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a href="../../index.html">← Fleet Builder</a>

<script src="scenario-civilian.js"></script>
<script src="scenario-hotspots.js"></script>

<script src="../shared/score.js"></script>
<script src="../shared/shell.js"></script>
<script>
/* The Fauna button inside a scenario opens the Fauna rules */
function pubOpen(id){ location.hash=id; }

/* Short facts for the index, named as the books name them, in the order the text uses them */
const DEP=[['Close Enough',/\bClose Enough\b/],['Column',/\bColumn\b/],['Standoff',/\bStandoff\b/],['Imminent',/\bImminent\b/],['Staggered',/\bStaggered\b/],['Backline',/\bBackline\b/],['Directly Deploy',/\bDirectly Deploy/],['Close',/\bClose\b(?! Enough)/],['Distant',/\bDistant\b/]];
const SCORE=[['Standard Scoring',/\bStandard Scoring\b/],['Normal Scoring',/\bNormal Scoring\b/],['Demolish Scoring',/\bDemolish/],['Focal Points',/\bFocal [Pp]oint/],['Kill Points',/\bKill Points\b/],['Assess',/\bAssess/],...OB.map(o=>[o.name,new RegExp('\\b'+o.name+'\\b')])];
const found=(text,list)=>list.map(([n,re])=>({n,m:text.match(re)})).filter(x=>x.m).sort((a,b)=>a.m.index-b.m.index).map(x=>x.n);
const uniq=a=>a.filter((x,i)=>a.indexOf(x)===i);
function players(s){
  const p=pubJoin(s.players).trim().replace(/\.$/,'');
  const n=p.match(/^(\d(?:-\d)?)(?: players)?$/i);
  return n?[n[1]]:(/attacker/i.test(p)&&/defender/i.test(p)?['Attacker and defender']:[]);
}
const scoringText=s=>[s.scoring,s.special,s.variant].map(pubJoin).join(' ');

ScenarioShell.start({
  storageKey:'dfc',
  titleSuffix:'Dropfleet Commander Scenarios',
  indexDocTitle:'Dropfleet Commander: Scenarios',
  indexTitle:'Scenarios',
  // Index groups: a heading and the source books under it (each scenario keeps its own book for its Source link)
  groups:[['Rulebook',['Rulebook']],['Scenario Expansion 1',['Scenario Expansion 1']],['Civilian Ship Scenarios',['Civilian Ships & Scenarios']],
    ['Converted 1e Scenarios',['The Ether Drake (1st edition)','Automated Dreadnought (1st edition)','Advent Scenarios (1st edition)','Core Scenarios (1st edition)']]]
    // Rulebook keeps the book's order; every other group reads A to Z
    .map(([name,srcs])=>({name,items:(items=>name==='Rulebook'?items:items.slice().sort((x,y)=>x.name.localeCompare(y.name)))(srcs.flatMap(src=>SCENARIOS.filter(s=>s.src===src&&s.id!=='fauna-rules')))})),
  id:s=>s.id,
  name:s=>s.name,
  // The Scenario Generator card above the books already rolls a scenario
  random:false,
  players:s=>currentPlayers(s),
  lead:`<a class="gen-card" href="generator/"><span class="gen-card-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17"/><circle cx="8.3" cy="8.3" r="1.5" fill="currentColor" stroke="none"/><circle cx="15.7" cy="8.3" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="8.3" cy="15.7" r="1.5" fill="currentColor" stroke="none"/><circle cx="15.7" cy="15.7" r="1.5" fill="currentColor" stroke="none"/></svg></span><span class="gen-card-name">Scenario Generator</span></a>`,
  thumb:s=>SCENARIO_MAPS.has(s.id)?`${SCN_ASSETS}scenarios/dropfleet/thumb/${s.id}.webp`:'',
  columns:[
    {label:'Players',values:players},
    {label:'Deployment',values:s=>uniq(found(pubJoin(s.deployment),DEP))},
    {label:'Scoring',values:s=>uniq(found(scoringText(s),SCORE))},
  ],
  randomPool:s=>SCENARIO_MAPS.has(s.id),
  render:renderScenario,
  source:s=>SCN_SOURCES[s.src]?{url:SCN_SOURCES[s.src],title:s.src}:null,
  // Older-edition pages score by their own sentences only; the current rulebook's scoring tables don't apply to them
  scoreRows:s=>s.sections?(r=>r.length?[{heading:'Scenario'},...r]:[])(vpRows(scoringText(s))):pubScoreRows(s),
  // Rounds 4 and 6 are marked when the sheet has anything scored on those rounds
  markRound:(s,r)=>(r===4||r===6)&&(s.sections?vpRows(scoringText(s)):pubScoreRows(s)).some(x=>x.sub==='Rounds 4 & 6'),
});
</script>
</body>
