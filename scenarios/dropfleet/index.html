<script>
/* The Fauna button inside a scenario opens the Fauna rules */
function pubOpen(id){ location.hash=id; }

/* Short facts for the index, named as the books name them, in the order the text uses them */
const DEP=[['Close Enough',/\bClose Enough\b/],['Column',/\bColumn\b/],['Standoff',/\bStandoff\b/],['Imminent',/\bImminent\b/],['Staggered',/\bStaggered\b/],['Backline',/\bBackline\b/],['Directly Deploy',/\bDirectly Deploy/],['Close',/\bClose\b(?! Enough)/],['Distant',/\bDistant\b/]];
const SCORE=[['Standard Scoring',/\bStandard Scoring\b/],['Normal Scoring',/\bNormal Scoring\b/],['Demolish Scoring',/\bDemolish/],['Focal Points',/\bFocal [Pp]oint/],['Kill Points',/\bKill Points\b/],['Assess',/\bAssess/],...OB.map(o=>[o.name,new RegExp('\\b'+o.name+'\\b')])];
const found=(text,list)=>list.map(([n,re])=>({n,m:text.match(re)})).filter(x=>x.m).sort((a,b)=>a.m.index-b.m.index).map(x=>x.n);
const uniq=a=>a.filter((x,i)=>a.indexOf(x)===i);
function players(s){
  const p=pubJoin(s.players).trim().replace(/\.$/,'');
  const n=p.match(/^(\d(?:-\d)?)(?: players)?$/i);
  return n?[n[1]]:(/attacker/i.test(p)&&/defender/i.test(p)?['Attacker and defender']:[]);
}
const scoringText=s=>[s.scoring,s.special,s.variant].map(pubJoin).join(' ');

ScenarioShell.start({
  storageKey:'dfc',
  titleSuffix:'Dropfleet Commander Scenarios',
  indexDocTitle:'Dropfleet Commander: Scenarios',
  indexTitle:'Scenarios',
  groups:['Rulebook','Scenario Expansion 1','Civilian Ships & Scenarios','The Ether Drake','Automated Dreadnought','Princess Cruise Liner','Advent Scenarios','Core Scenarios','Tournament Pack 2017'].map(name=>({name,items:SCENARIOS.filter(s=>s.src===name)})),
  id:s=>s.id,
  name:s=>s.name,
  thumb:s=>SCENARIO_MAPS.has(s.id)?`${SCN_ASSETS}scenarios/dropfleet/thumb/${s.id}.webp`:'',
  columns:[
    {label:'Players',values:players},
    {label:'Deployment',values:s=>uniq(found(pubJoin(s.deployment),DEP))},
    {label:'Scoring',values:s=>uniq(found(scoringText(s),SCORE))},
  ],
  randomPool:s=>SCENARIO_MAPS.has(s.id),
  render:renderScenario,
  source:s=>SCN_SOURCES[s.src],
  // Older-edition pages score by their own sentences only; the current rulebook's scoring tables don't apply to them
  scoreRows:s=>s.sections?(r=>r.length?[{heading:'Scenario'},...r]:[])(vpRows(scoringText(s))):pubScoreRows(s),
  // Standard, Normal and Focal Points scoring award VP in rounds 4 and 6; so do objectives that use Standard Scoring
  markRound:(s,r)=>!s.sections&&(r===4||r===6)&&(/\b(Standard|Normal) Scoring\b|\bFocal [Pp]oint/.test(scoringText(s))||OB.some(o=>o.std&&new RegExp('\\b'+o.name+'\\b').test(scoringText(s)))),
});
</script>
