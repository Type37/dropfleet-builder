<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<title>Faction Quick References · WarLore Wargaming</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700;800&family=Barlow+Condensed:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "Terminal Grotesque Open";
    src: url("../assets/fonts/terminal-grotesque-open.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  :root { --ink: #14110c; --paper: #f5f1e8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: 'Barlow Condensed', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 64px 20px 40px;
  }
  .back {
    position: fixed; top: 20px; left: 20px;
    font-family: 'Jost', sans-serif; font-weight: 700; font-size: 15px;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink); text-decoration: none;
    display: flex; align-items: center; gap: 6px;
  }
  .back:hover { text-decoration: underline; text-underline-offset: 4px; }
  h1 { font-family: 'Jost', sans-serif; font-weight: 800; font-size: 46px; letter-spacing: -0.01em; line-height: 0.95; text-align: center; }
  .sub { font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; letter-spacing: 0.02em; text-transform: uppercase; color: #6b6252; margin-top: 8px; margin-bottom: 40px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; width: 100%; max-width: 840px; }
  @media (max-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } h1 { font-size: 34px; } }
  a.card {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 28px 20px 22px;
    border-radius: 6px;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border: 2px solid var(--c);
    box-shadow: 0 1px 0 rgba(20,17,12,0.04);
    transition: background 0.14s, transform 0.14s, box-shadow 0.14s;
  }
  a.card:hover { background: var(--c); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(20,17,12,0.16); }
  a.card img { width: 84px; height: 84px; object-fit: contain; transition: filter 0.14s; }
  a.card:hover img { filter: brightness(0) invert(1); }
  a.card .name { font-family: 'Jost', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1; color: var(--t, var(--c)); transition: color 0.14s; }
  a.card:hover .name { color: #fff; }
  a.card .hint { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; letter-spacing: 0.02em; color: #7a7060; transition: color 0.14s; text-align: center; }
  a.card:hover .hint { color: rgba(255,255,255,0.85); }
  .ucm{--c:#3e9945} .phr{--c:#e8c400;--t:#6f5300} .scourge{--c:#69499d}
  .shaltari{--c:#ef6325} .resistance{--c:#3d8bca} .bioficer{--c:#b2322a}
  /* PHR: yellow reads on white only with dark ink, not white */
  .phr:hover img { filter: brightness(0); }
  .phr:hover .name { color: var(--ink); }
  .phr:hover .hint { color: rgba(20,17,12,0.7); }
  .foot {
    margin-top: 44px; width: 100%; max-width: 840px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
    padding-top: 4px; border-top: 1px solid var(--ink); position: relative;
  }
  .foot::before { content: ''; position: absolute; left: 0; right: 0; top: 2px; border-top: 1px solid var(--ink); }
  .foot .left, .foot .right { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; letter-spacing: 0.04em; color: #6b6252; display: flex; align-items: center; gap: 8px; }
  .foot .right { text-align: right; justify-content: flex-end; }
  .foot .left a { color: inherit; text-decoration: none; }
  .foot .left a:hover { color: var(--ink); }
  .warlore-mark {
    font-family: "Terminal Grotesque Open", serif; font-size: 18px; line-height: 1;
    color: #FFCC00; background: #000; padding: 1px 6px; text-decoration: none;
    transition: color 0.14s, background 0.14s;
  }
  .warlore-mark:hover { color: #000; background: #FFCC00; }
</style>
</head>
<body>
<a class="back" href="../">&larr; Fleet Builder</a>
<h1>Dropfleet Commander</h1>
<p class="sub">Faction Quick References</p>
<div class="grid">
  <a class="card ucm"        href="ucm.html"        target="_blank"><img src="../assets/factions/ucm.webp"        alt=""><span class="name">UCM</span><span class="hint">United Colonies of Mankind</span></a>
  <a class="card phr"        href="phr.html"        target="_blank"><img src="../assets/factions/phr.webp"        alt=""><span class="name">PHR</span><span class="hint">Post-Human Republic</span></a>
  <a class="card scourge"    href="scourge.html"    target="_blank"><img src="../assets/factions/scourge.webp"    alt=""><span class="name">Scourge</span></a>
  <a class="card shaltari"   href="shaltari.html"   target="_blank"><img src="../assets/factions/shaltari.webp"   alt=""><span class="name">Shaltari</span></a>
  <a class="card resistance" href="resistance.html" target="_blank"><img src="../assets/factions/resistance.webp" alt=""><span class="name">Resistance</span></a>
  <a class="card bioficer"   href="bioficer.html"   target="_blank"><img src="../assets/factions/bioficer.webp"   alt=""><span class="name">Bioficer</span></a>
</div>
<footer class="foot">
  <div class="left"><a href="https://linktr.ee/warlore" target="_blank" rel="noopener">linktr.ee/warlore</a></div>
  <div class="center"></div>
  <div class="right">QRS by <a class="warlore-mark" href="https://linktr.ee/warlore" target="_blank" rel="noopener">WarLore</a></div>
</footer>
</body></html>
