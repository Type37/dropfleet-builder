<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b3a5c">
<title>DFC Mobile — Fleet Builder</title>
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/logos/favicon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dropfleet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Plain stylesheet link (matches desktop). display=swap shows text immediately;
     the preload+onload-swap pattern previously here failed to apply the fonts on
     some mobile browsers, so the system fallback was silently winning. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Roboto+Slab:wght@700&family=Barlow+Condensed:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="css/mobile.css">
<!-- Privacy-friendly, cookieless analytics (no personal data). Page load auto-counts; screen changes counted in mobile.js. -->
<script data-goatcounter="https://warlore.goatcounter.com/count"
        async src="../js/count.js"></script>
</head>
<body>

<!-- ═══ App Bar ═══ -->
<header class="app-bar" id="app-bar">
  <button class="app-bar-menu hidden" id="app-bar-menu" aria-label="Menu" onclick="App.viewDesktop()">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
  </button>
  <button class="app-bar-back hidden" id="app-bar-back" onclick="App.goBack()" aria-label="Back">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
  </button>
  <span class="app-bar-title" id="app-bar-title">Fleet Builder</span>
  <span class="app-bar-pts hidden" id="app-bar-pts"></span>
  <button class="app-bar-overflow hidden" id="app-bar-overflow" aria-label="More" onclick="App.overflow()">&middot;&middot;&middot;</button>
</header>

<!-- ═══ Screens ═══ -->

<!-- Fleet List -->
<main class="screen active screen-padded" id="screen-fleet-list">
  <div id="fleet-list-rows">
    <!-- Populated by JS -->
  </div>
  <footer class="m-footer">
    <div><span class="m-footer-title">Dropfleet Commander</span> · by <a href="https://www.ttcombat.com/games/dropfleet-commander" target="_blank" rel="noopener">TTCombat</a></div>
    <div class="m-footer-credit">Fleet builder by <a class="wl-brand" href="https://jetwong.neocities.org/" target="_blank" rel="noopener">WarLore</a> · <a href="https://github.com/Type37/dropfleet-builder" target="_blank" rel="noopener">Source on GitHub</a></div>
  </footer>
  <div class="bottom-action">
    <button class="btn btn-primary btn-block" onclick="App.openCreateFleet()">Create Fleet</button>
    <button class="btn-textlink" onclick="App.openStarterFleets()">or load Fast Play Sheets</button>
    <button class="btn-textlink" onclick="App.importFleetPrompt()">or import a shared fleet</button>
  </div>
</main>

<!-- Fleet Detail -->
<main class="screen screen-padded" id="screen-fleet-detail">
  <div class="fleet-header">
    <div class="fleet-header-name" id="fleet-detail-name">Fleet Name</div>
    <div class="fleet-header-sub" id="fleet-detail-sub">Faction</div>
  </div>
  <div class="points-bar">
    <div class="points-bar-row">
      <span id="fleet-pts-current">0 / 1500 pts</span>
      <span id="fleet-pts-remaining" style="color:var(--fg3)">1500 remaining</span>
    </div>
    <div class="points-track">
      <div class="points-fill" id="fleet-pts-fill" style="width:0%"></div>
    </div>
  </div>
  <div id="fleet-coach"><!-- Guided next-step, populated by JS --></div>
  <div class="warning-bar hidden" id="fleet-warnings">
    <!-- Populated by JS -->
  </div>
  <div id="fleet-groups" style="padding-bottom:88px">
    <!-- Populated by JS -->
  </div>
  <!-- Floating Add Group button — always visible -->
  <button class="fab" id="fab-add-group" onclick="App.openAddGroup()" aria-label="Add Group">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M11 4v14M4 11h14"/></svg>
    <span>Add Group</span>
  </button>
</main>

<!-- Add Group (Ship Picker) -->
<main class="screen" id="screen-add-group">
  <div class="search-bar">
    <input class="search-input" id="picker-search" type="text" placeholder="Search ships...">
  </div>
  <div class="chip-row" id="picker-chips">
    <!-- Populated by JS -->
  </div>
  <div class="sort-row" id="picker-sort">
    <!-- Populated by JS -->
  </div>
  <div id="picker-list">
    <!-- Populated by JS -->
  </div>
</main>

<!-- Group Detail -->
<main class="screen screen-padded" id="screen-group-detail">
  <div id="group-detail-content">
    <!-- Populated by JS -->
  </div>
</main>

<!-- Admiral Picker -->
<main class="screen" id="screen-admiral">
  <div id="admiral-list">
    <!-- Populated by JS -->
  </div>
</main>

<!-- Admiral Detail -->
<main class="screen screen-padded" id="screen-admiral-detail">
  <div id="admiral-detail-content">
    <!-- Populated by JS -->
  </div>
</main>

<!-- Station Picker -->
<main class="screen" id="screen-station">
  <div id="station-list">
    <!-- Populated by JS -->
  </div>
</main>

<!-- ═══ Modals ═══ -->

<!-- Create Fleet -->
<div class="modal-overlay" id="modal-create-fleet">
  <div class="modal-panel">
    <div class="modal-header">
      <div class="modal-title" id="modal-fleet-title">New Fleet</div>
      <button class="modal-close" onclick="App.closeCreateFleet()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Faction</label>
        <select class="form-select" id="new-fleet-faction">
          <!-- Populated by JS -->
        </select>
        <div class="form-hint" id="new-fleet-faction-desc"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Name</label>
        <input class="form-input" id="new-fleet-name" type="text" placeholder="e.g. Task Force Aegis">
      </div>
      <div class="form-group">
        <label class="form-label">Game Size</label>
        <select class="form-select" id="new-fleet-size">
          <!-- Populated by JS -->
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-textarea" id="new-fleet-desc" placeholder="Fleet notes..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-block" id="modal-fleet-submit" onclick="App.doCreateFleet()">Create Fleet</button>
    </div>
  </div>
</div>

<!-- ═══ Action Sheet (overflow menus) ═══ -->
<div class="sheet-scrim" id="action-sheet-scrim" onclick="App.closeActionSheet()"></div>
<div class="action-sheet" id="action-sheet" role="menu">
  <div class="rule-sheet-handle" onclick="App.closeActionSheet()"></div>
  <div id="action-sheet-items"></div>
  <button class="action-sheet-cancel" onclick="App.closeActionSheet()">Cancel</button>
</div>

<!-- ═══ Rule Bottom Sheet ═══ -->
<div class="sheet-scrim" id="rule-sheet-scrim" onclick="App.closeRuleSheet()"></div>
<div class="rule-sheet" id="rule-sheet" role="dialog" aria-modal="true">
  <div class="rule-sheet-handle" onclick="App.closeRuleSheet()"></div>
  <div class="rule-sheet-head">
    <div class="rule-sheet-title" id="rule-sheet-title"></div>
    <button class="rule-sheet-close" onclick="App.closeRuleSheet()" aria-label="Close">&times;</button>
  </div>
  <div class="rule-sheet-body" id="rule-sheet-body"></div>
  <div class="rule-sheet-page" id="rule-sheet-page"></div>
</div>

<!-- Print root (populated by Export PDF; hidden except when printing) -->
<div id="print-root" aria-hidden="true"></div>

<script src="js/mobile.js"></script>
</body>
</html>
