<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1b3a5c">
<title>Dropfleet Commander, Fleet Builder (Mobile)</title>
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/logos/favicon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dropfleet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Plain stylesheet link (matches desktop). display=swap shows text immediately;
     the preload+onload-swap pattern previously here failed to apply the fonts on
     some mobile browsers, so the system fallback was silently winning. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Roboto+Slab:wght@700&family=Barlow+Condensed:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="css/mobile.css">
<!-- Privacy-friendly, cookieless analytics (no personal data). Page load auto-counts; screen changes counted in mobile.js. -->
<script data-goatcounter="https://warlore.goatcounter.com/count"
        async src="../js/count.js"></script>
</head>
<body>

<!-- ═══ App Bar ═══ -->
<header class="app-bar" id="app-bar">
  <button class="app-bar-menu hidden" id="app-bar-menu" aria-label="Settings" onclick="App.openSettingsSheet()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path opacity=".55" d="M13.765 2.152C13.398 2 12.932 2 12 2s-1.398 0-1.765.152a2 2 0 0 0-1.083 1.083c-.092.223-.129.484-.143.863a1.62 1.62 0 0 1-.79 1.353a1.62 1.62 0 0 1-1.567.008c-.336-.178-.579-.276-.82-.308a2 2 0 0 0-1.478.396C4.04 5.79 3.806 6.193 3.34 7s-.7 1.21-.751 1.605a2 2 0 0 0 .396 1.479c.148.192.355.353.676.555c.473.297.777.803.777 1.361s-.304 1.064-.777 1.36c-.321.203-.529.364-.676.556a2 2 0 0 0-.396 1.479c.052.394.285.798.75 1.605c.467.807.7 1.21 1.015 1.453a2 2 0 0 0 1.479.396c.24-.032.483-.13.819-.308a1.62 1.62 0 0 1 1.567.008c.483.28.77.795.79 1.353c.014.38.05.64.143.863a2 2 0 0 0 1.083 1.083C10.602 22 11.068 22 12 22s1.398 0 1.765-.152a2 2 0 0 0 1.083-1.083c.092-.223.129-.483.143-.863c.02-.558.307-1.074.79-1.353a1.62 1.62 0 0 1 1.567-.008c.336.178.579.276.819.308a2 2 0 0 0 1.479-.396c.315-.242.548-.646 1.014-1.453s.7-1.21.751-1.605a2 2 0 0 0-.396-1.479c-.148-.192-.355-.353-.676-.555A1.62 1.62 0 0 1 19.562 12c0-.558.304-1.064.777-1.36c.321-.203.529-.364.676-.556a2 2 0 0 0 .396-1.479c-.052-.394-.285-.798-.75-1.605c-.467-.807-.7-1.21-1.015-1.453a2 2 0 0 0-1.479-.396c-.24.032-.483.13-.82.308a1.62 1.62 0 0 1-1.566-.008a1.62 1.62 0 0 1-.79-1.353c-.014-.38-.05-.64-.143-.863a2 2 0 0 0-1.083-1.083Z"/></svg>
  </button>
  <button class="app-bar-back hidden" id="app-bar-back" onclick="App.goBack()" aria-label="Back">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
  </button>
  <span class="app-bar-title" id="app-bar-title">Fleet Builder</span>
  <span class="app-bar-pts hidden" id="app-bar-pts"></span>
  <button class="app-bar-overflow hidden" id="app-bar-overflow" aria-label="More" onclick="App.overflow()">&middot;&middot;&middot;</button>
</header>

<!-- ═══ Screens ═══ -->

<!-- Fleet List -->
<main class="screen active screen-padded" id="screen-fleet-list">
  <div id="fleet-list-rows">
    <!-- Populated by JS -->
  </div>
  <footer class="m-footer">
    <div><span class="m-footer-title">Dropfleet Commander</span> · by <a href="https://www.ttcombat.com/games/dropfleet-commander" target="_blank" rel="noopener">TTCombat</a></div>
    <!-- The other WarLore builder, matching the desktop footer. -->
    <div class="m-footer-credit">Fleet builder by <a class="warlore-mark warlore-mark-inline" href="https://linktr.ee/warlore" target="_blank" rel="noopener" title="WarLore">War<span class="wl-lore">Lore</span></a> · <a href="https://type37.github.io/dropzone-3e-army-builder/" target="_blank" rel="noopener">Dropzone</a> · <a href="https://github.com/Type37/dropfleet-builder" target="_blank" rel="noopener">Source on GitHub</a></div>
  </footer>
  <div class="bottom-action">
    <button class="btn btn-primary btn-block" onclick="App.openCreateFleet()">Create Fleet</button>
    <button class="btn-textlink" onclick="App.openStarterFleets()">or load Fast Play Sheets</button>
    <button class="btn-textlink" onclick="App.importFleetPrompt()">or import a shared fleet</button>
  </div>
</main>

<!-- Fleet Detail -->
<main class="screen screen-padded" id="screen-fleet-detail">
  <div class="fleet-header">
    <div class="fleet-header-name" id="fleet-detail-name">Fleet Name</div>
    <div class="fleet-header-sub" id="fleet-detail-sub">Faction</div>
  </div>
  <div class="points-bar">
    <div class="points-bar-row">
      <span id="fleet-pts-current">0 / 1500 pts</span>
      <span id="fleet-pts-remaining" style="color:var(--fg3)">1500 remaining</span>
    </div>
    <div class="points-track">
      <div class="points-fill" id="fleet-pts-fill" style="width:0%"></div>
    </div>
  </div>
  <div class="warning-bar hidden" id="fleet-warnings">
    <!-- Populated by JS -->
  </div>
  <div id="fleet-groups" style="padding-bottom:88px">
    <!-- Populated by JS -->
  </div>
</main>

<!-- Add Group (Ship Picker) -->
<main class="screen" id="screen-add-group">
  <div class="search-bar">
    <input class="search-input" id="picker-search" type="text" placeholder="Search ships...">
  </div>
  <div class="chip-row" id="picker-chips">
    <!-- Populated by JS -->
  </div>
  <div class="sort-row" id="picker-sort">
    <!-- Populated by JS -->
  </div>
  <div id="picker-list">
    <!-- Populated by JS -->
  </div>
</main>

<!-- Group Detail -->
<main class="screen screen-padded" id="screen-group-detail">
  <div id="group-detail-content">
    <!-- Populated by JS -->
  </div>
</main>

<!-- Admiral Picker -->
<main class="screen" id="screen-admiral">
  <div id="admiral-list">
    <!-- Populated by JS -->
  </div>
</main>

<!-- Admiral Detail -->
<main class="screen screen-padded" id="screen-admiral-detail">
  <div id="admiral-detail-content">
    <!-- Populated by JS -->
  </div>
</main>

<!-- Station Picker -->
<main class="screen" id="screen-station">
  <div id="station-list">
    <!-- Populated by JS -->
  </div>
</main>

<!-- Station Detail (stats, weapons, and hardpoint armaments for generic stations) -->
<main class="screen screen-padded" id="screen-station-detail">
  <div id="station-detail-content">
    <!-- Populated by JS -->
  </div>
</main>

<!-- Collection (models you own) — shares the dfc_collection schema with desktop -->
<main class="screen" id="screen-collection">
  <div id="collection-container">
    <!-- Populated by JS -->
  </div>
</main>

<!-- Play Mode -->
<main class="screen" id="screen-play">
  <div id="play-content">
    <!-- Populated by App.renderMobilePlay() -->
  </div>
</main>

<!-- Floating Add Group button. MUST live at body level (outside .screen, which
     has will-change:transform and would re-anchor position:fixed to itself,
     parking the FAB off-screen). Shown only on the fleet-detail screen. -->
<button class="fab" id="fab-add-group" onclick="App.openAddGroup()" aria-label="Add Group" style="display:none">
  <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M11 4v14M4 11h14"/></svg>
  <span>Add Group</span>
</button>

<!-- ═══ Modals ═══ -->

<!-- Create Fleet -->
<div class="modal-overlay" id="modal-create-fleet">
  <div class="modal-panel">
    <div class="modal-header">
      <div class="modal-title" id="modal-fleet-title">New Fleet</div>
      <button class="modal-close" onclick="App.closeCreateFleet()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Faction</label>
        <select class="form-select" id="new-fleet-faction">
          <!-- Populated by JS -->
        </select>
        <div class="form-hint" id="new-fleet-faction-desc"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Name</label>
        <input class="form-input" id="new-fleet-name" type="text" placeholder="Name your fleet">
      </div>
      <div class="form-group">
        <label class="form-label">Game Size</label>
        <input type="hidden" id="new-fleet-size">
        <div id="new-fleet-size-cards" class="size-card-list">
          <!-- Populated by JS -->
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Points limit</label>
        <input class="form-input" id="new-fleet-points" type="number" min="0" step="50" inputmode="numeric" placeholder="">
        <div class="form-hint">Leave blank for the game size's default.</div>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-textarea" id="new-fleet-desc" placeholder="Fleet notes..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-block" id="modal-fleet-submit" onclick="App.doCreateFleet()">Create Fleet</button>
    </div>
  </div>
</div>

<!-- ═══ Admiral abilities picker (pops up on add) ═══ -->
<div class="modal-overlay" id="modal-abilities">
  <div class="modal-panel modal-panel-pop">
    <div class="modal-header">
      <div class="modal-title" id="abilities-modal-title">Choose Abilities</div>
      <button class="modal-close" onclick="App.closeAbilityModal()">&times;</button>
    </div>
    <div class="modal-body" id="abilities-modal-body"><!-- Populated by JS --></div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-block" onclick="App.closeAbilityModal()">Done</button>
    </div>
  </div>
</div>

<!-- ═══ Secondary Objectives picker (pop-up) ═══ -->
<div class="modal-overlay" id="modal-secondary">
  <div class="modal-panel modal-panel-pop">
    <div class="modal-header">
      <div class="modal-title">Secondary Objectives</div>
      <button class="modal-close" onclick="App.closeSecondaryModal()">&times;</button>
    </div>
    <div class="modal-body">
      <p class="form-hint" id="secondary-modal-sub" style="margin-bottom:var(--sp-m)"></p>
      <div id="secondary-modal-body"><!-- Populated by JS --></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-block" onclick="App.closeSecondaryModal()">Done</button>
    </div>
  </div>
</div>

<!-- ═══ Action Sheet (overflow menus) ═══ -->
<div class="modal-overlay" id="modal-sync">
  <div class="modal-panel modal-panel-pop">
    <div class="modal-header">
      <div class="modal-title">Sync Your Fleets Online</div>
      <button class="modal-close" onclick="App.closeSyncModal()">&times;</button>
    </div>
    <div class="modal-body" id="sync-body"><!-- Populated by JS --></div>
  </div>
</div>

<div class="sheet-scrim" id="action-sheet-scrim" onclick="App.closeActionSheet()"></div>
<div class="action-sheet" id="action-sheet" role="menu">
  <div class="rule-sheet-handle" onclick="App.closeActionSheet()"></div>
  <div id="action-sheet-items"></div>
  <button class="action-sheet-cancel" onclick="App.closeActionSheet()">Cancel</button>
</div>

<!-- ═══ Rule Bottom Sheet ═══ -->
<div class="sheet-scrim" id="rule-sheet-scrim" onclick="App.closeRuleSheet()"></div>
<div class="rule-sheet" id="rule-sheet" role="dialog" aria-modal="true">
  <div class="rule-sheet-handle" onclick="App.closeRuleSheet()"></div>
  <div class="rule-sheet-head">
    <div class="rule-sheet-title" id="rule-sheet-title"></div>
    <button class="rule-sheet-close" onclick="App.closeRuleSheet()" aria-label="Close">&times;</button>
  </div>
  <div class="rule-sheet-body" id="rule-sheet-body"></div>
  <div class="rule-sheet-page" id="rule-sheet-page"></div>
</div>

<!-- Print root (populated by Export PDF; hidden except when printing) -->
<div id="print-root" aria-hidden="true"></div>

<script src="../js/rank-insignia.js"></script>
<script src="../js/offline-sync.js"></script>
<script src="../js/fleet-sync.js"></script>
<script src="js/mobile.js"></script>
<script>
  // The /mobile/ app needs its OWN service-worker registration: home-screen PWA
  // users never load the desktop index.html, so without this they'd freeze on a
  // stale cache forever. Registers the root sw.js (scope covers /mobile/).
  // Service worker is PRODUCTION-ONLY (see desktop index.html for the why). On
  // localhost we skip registration AND unregister any existing SW + purge caches,
  // so local preview of /mobile/ is never intercepted by a stale dev SW.
  const IS_LOCAL = ['localhost', '127.0.0.1', '0.0.0.0', ''].includes(location.hostname);
  if ('serviceWorker' in navigator && IS_LOCAL) {
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
    if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
  } else if ('serviceWorker' in navigator) {
    if (navigator.serviceWorker.controller) {
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return; reloading = true; window.location.reload();
      });
    }
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('../sw.js').then(reg => {
        const check = () => reg.update().catch(() => {});
        setInterval(check, 60000);
        // iOS throttles background timers, so also check whenever the app
        // regains focus (returning to the home-screen PWA / Safari tab).
        document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
