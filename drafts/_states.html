<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hover states</title>
<style>
body{margin:0;background:#2b2b2b;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.f{position:relative;width:100%;height:420px;overflow:hidden;background:#000}
.f iframe{position:absolute;left:0;top:0;width:1200px;height:900px;border:0;transform:scale(.6);transform-origin:0 0}
</style>
</head>
<body>
<div class="f"><iframe src="footer-hellohello.html?only=hh&show=dropfleet"></iframe></div>
<div class="f"><iframe src="footer-hellohello.html?only=hh&show=pacific"></iframe></div>
<div class="f"><iframe src="footer-hellohello.html?only=hh&show=warcrow"></iframe></div>
<div class="f"><iframe src="footer-hellohello.html?only=hh&show=hs"></iframe></div>
</body>
</html>
