<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WarLore footer, hellohello</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"TG Open";src:url("../assets/fonts/terminal-grotesque-open.woff2") format("woff2");font-display:swap}
:root{
  --amber:#FFCC00; --black:#000; --teal:#16E0BD; --red:#EF476F;
  --inter:"Inter",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#141414;font-family:var(--inter)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
footer a:focus-visible,footer button:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.src{font:500 15px/1.3 var(--inter);margin:64px 20px 12px}
.src:first-child{margin-top:20px}
.src a{text-decoration:underline}

.wl{display:inline-block;background:var(--black);color:var(--amber);font-family:"TG Open",var(--mono);line-height:.88;padding:.05em .12em}
.wl:hover,.wl:focus-visible{background:var(--amber);color:var(--black)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ext::after{content:"\2197";margin-left:.25em;font-size:.85em}
[aria-current="page"]{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.15em}

/* A. ++hellohello
   amber = made by WarLore (wordmark, tools, wikis)
   teal  = WarLore channels elsewhere (headline, YouTube bar) */
.hh{--own:#FFCC00;--out:#16E0BD;--dim:#F3F0EA;position:relative;isolation:isolate;overflow:clip;background:#000;color:var(--out);padding:clamp(20px,2vw,32px) clamp(20px,2vw,32px) 6px}
/* rotating dark photos: greyscale Windows Color Waves, under a flat 55% black veil so every text colour keeps AA contrast */
.hh .bgs{position:absolute;inset:0;z-index:-2;pointer-events:none}
.hh .bgs i{position:absolute;inset:0;background:50% 60%/cover no-repeat;opacity:0;transition:opacity 1.6s ease}
.hh .bgs i.on{opacity:1}
.hh::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:rgba(0,0,0,.55)}
/* the thin line from the original */
.hh .rule{height:clamp(3px,.32vw,5px);background:var(--out);margin-bottom:clamp(18px,2.4vw,36px)}
.hh a{text-underline-offset:.14em}
.hh .head{display:flex;justify-content:space-between;align-items:flex-start;gap:clamp(16px,3vw,48px)}
.hh .chans{display:flex;flex-wrap:wrap;gap:0 .32em;font:700 clamp(2.4rem,6.4vw,6.2rem)/.92 var(--inter);letter-spacing:-.055em;max-width:14ch}
.hh .chans a{color:var(--out)}
.hh .chans a:hover{color:var(--dim)}
.hh .chans .ext::after{font-size:.32em;vertical-align:.9em;margin-left:.1em;letter-spacing:0}
.hh .head .wl{font-size:clamp(4rem,13vw,12.5rem);flex:none}
.hh .band{position:relative;height:clamp(56px,calc(24vw - 40px),320px)}
.hh .reveal{position:absolute;right:0;bottom:clamp(8px,1.2vw,18px);display:flex;flex-direction:column;align-items:flex-end;gap:12px;max-width:min(560px,70%);text-align:right;opacity:0;transform:translateY(6px);transition:opacity .22s ease,transform .22s ease;pointer-events:none}
.hh .reveal.on{opacity:1;transform:none}
.hh .reveal img{display:block;height:clamp(34px,4.6vw,72px);width:auto;max-width:100%;filter:grayscale(1);opacity:.6}
.hh .reveal .osp{display:inline-block;background:#004C80;color:#fff;font:800 clamp(1.3rem,2.6vw,2.4rem)/1 var(--inter);text-transform:uppercase;letter-spacing:-.01em;padding:.32em .55em .28em;opacity:.8}
.hh .reveal b{display:block;font:600 clamp(1rem,1.3vw,1.25rem)/1.2 var(--inter);color:var(--dim)}
.hh .reveal span{display:block;font:500 clamp(.9rem,1.1vw,1.05rem)/1.3 var(--inter);color:var(--dim);opacity:.8}
@media (hover:none){.hh .reveal{display:none}}
@media (prefers-reduced-motion:reduce){.hh .reveal{transition:none;transform:none}}
.hh .tiny{height:.95em;width:auto;margin-right:.35em;vertical-align:-.12em;filter:grayscale(1);opacity:.9}
.hh .tools{display:flex;flex-wrap:wrap;gap:4px clamp(14px,1.6vw,26px);margin-top:0;font:700 clamp(1.15rem,1.75vw,1.75rem)/1.2 var(--inter);letter-spacing:-.035em}
.hh .tools a{display:inline-flex;align-items:center;min-height:32px;color:var(--own)}
.hh .tools a:hover{color:var(--dim)}
.hh .bar{display:flex;justify-content:space-between;align-items:center;margin:clamp(14px,1.4vw,22px) 0 clamp(18px,2vw,30px);padding:clamp(18px,2vw,28px) clamp(16px,1.6vw,24px);background:var(--out);color:#000;font:600 clamp(1.35rem,2.3vw,2.3rem)/1 var(--inter);letter-spacing:-.035em}
.hh .bar:hover{background:var(--own)}
.hh .bar svg{width:clamp(20px,2vw,30px);height:auto;flex:none}
.hh .base{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:0 24px;font:600 .8125rem/1.25 var(--inter)}
.hh .base nav{display:flex;flex-wrap:wrap;gap:0 18px}
.hh .base a,.hh .base button,.hh .base span{display:inline-flex;align-items:center;min-height:32px}
.hh .base .own{color:var(--own)}
.hh .base .dim{color:var(--dim)}
.hh .base a:hover,.hh .base button:hover{color:var(--out)}
@media (max-width:640px){.hh .head{flex-direction:column;align-items:stretch}.hh .head .wl{align-self:flex-start}.hh .head .wl{order:-1}.hh .chans{max-width:none}.hh .base{flex-direction:column;align-items:flex-start}}

/* B. Kuba */
.kb{background:#EFEFEF;padding:90px 8% 36px}
.kb .grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.kb .grid>.wl{font-size:clamp(3.4rem,8vw,6.5rem);align-self:start;justify-self:start}
.kb .btns{display:flex;flex-wrap:wrap}
.kb .btns a{font:500 .7rem/1 var(--inter);text-transform:uppercase;padding:10px 12px;background:#fff}
.kb .btns a:first-child{background:var(--black);color:var(--amber)}
.kb .btns a:hover{background:var(--amber);color:var(--black)}
.kb dl{display:grid;grid-template-columns:120px 1fr;gap:46px 0;margin:64px 0 0}
.kb dt{font:500 .66rem/1.6 var(--mono);text-transform:uppercase}
.kb dd{margin:0}
.kb dd a{display:block;font:400 .92rem/1.5 var(--inter)}
.kb dd a:hover{text-decoration:underline}
.kb .base{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 40px;margin-top:100px;font:400 .66rem/1.4 var(--mono);text-transform:uppercase}
.kb .base nav{display:flex;gap:28px;margin-right:12%}
@media (max-width:760px){.kb{padding-top:40px}.kb .grid{grid-template-columns:1fr}.kb dl{grid-template-columns:100px 1fr;margin-top:40px}.kb .base nav{margin-right:0}}

/* C. Xavier Coulombe-Murray */
.xc{background:var(--black);color:#fff;padding:14px}
.xc .grid{display:grid;grid-template-columns:1fr auto 210px;gap:18px;align-items:center}
.xc .grid>div:first-child>.wl{font-size:2.1rem;margin:0 0 6px}
.xc .line{font:600 1rem/1.4 var(--inter);color:#A3A3A3;max-width:720px}
.xc .line a:hover,.xc .line [aria-current]{color:#fff}
.xc .line .sep{margin:0 .35em;color:#555}
.xc .line+.line{margin-top:4px;font-weight:500;font-size:.9rem}
.xc .tiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.xc .tile{width:92px;height:84px;background:#1d1d1d;border-radius:4px;padding:7px;display:flex;flex-direction:column;justify-content:space-between;font:600 .64rem/1.3 var(--inter)}
.xc .tile small{display:block;font-weight:400;color:#A3A3A3;word-break:break-word}
.xc .tile:hover{background:#2e2e2e}
.xc .tile.yt{background:var(--red);color:var(--black)}
.xc .tile.yt small{color:var(--black)}
.xc .tile.yt:hover{background:var(--amber)}
.xc .tile svg{width:13px;height:13px}
.xc .clock{width:190px;height:190px;border-radius:50%;background:#1a1a1a;position:relative}
.xc .clock b{position:absolute;left:50%;top:50%;transform-origin:50% 100%;border-radius:4px}
.xc .clock .h{width:8px;height:40px;margin:-40px 0 0 -4px;background:#fff}
.xc .clock .m{width:6px;height:68px;margin:-68px 0 0 -3px;background:#1a1a1a;border:2px solid #fff}
.xc .clock .s{width:2px;height:74px;margin:-74px 0 0 -1px;background:var(--teal)}
.xc .clock i{position:absolute;left:50%;top:6px;width:1px;height:12px;background:#555;transform-origin:50% 89px}
.xc .photo{background:#111;border-radius:6px;height:190px;display:flex;align-items:center;justify-content:center}
.xc .photo img{width:100%;height:100%;object-fit:contain;filter:grayscale(1) contrast(1.1)}
@media (max-width:860px){.xc .grid{grid-template-columns:1fr}.xc .clock{display:none}.xc .photo{height:150px}}
</style>
</head>
<body>
<div id="gallery"></div>

  { id:'discord',   name:'Discord',   handle:'Join',      url:'https://discord.com/invite/kmE8bK84gu', icon:`<svg xmlns="http://www.w3.org/2000/svg" class="ic" aria-hidden="true" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M8 12a1 1 0 1 0 2 0a1 1 0 0 0-2 0m6 0a1 1 0 1 0 2 0a1 1 0 0 0-2 0"/><path d="M15.5 17c0 1 1.5 3 2 3c1.5 0 2.833-1.667 3.5-3c.667-1.667.5-5.833-1.5-11.5c-1.457-1.015-3-1.34-4.5-1.5l-.972 1.923a11.9 11.9 0 0 0-4.053 0L9 4c-1.5.16-3.043.485-4.5 1.5c-2 5.667-2.167 9.833-1.5 11.5c.667 1.333 2 3 3.5 3c.5 0 2-2 2-3"/><path d="M7 16.5c3.5 1 6.5 1 10 0"/></g></svg>` },
  { id:'bluesky',   name:'Bluesky',   handle:'warlore',   url:'https://bsky.app/profile/warlore.bsky.social', icon:`<svg xmlns="http://www.w3.org/2000/svg" class="ic" aria-hidden="true" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6.335 5.144C4.681 3.945 2 3.017 2 5.97c0 .59.35 4.953.556 5.661C3.269 14.094 5.686 14.381 8 14c-4.045.665-4.889 3.208-2.667 5.41C6.363 20.428 7.246 21 8 21c2 0 3.134-2.769 3.5-3.5q.5-1 .5-1.5q0 .5.5 1.5c.366.731 1.5 3.5 3.5 3.5c.754 0 1.637-.571 2.667-1.59C20.889 17.207 20.045 14.664 16 14c2.314.38 4.73.094 5.444-2.369c.206-.708.556-5.072.556-5.661c0-2.953-2.68-2.025-4.335-.826C15.372 6.806 12.905 10.192 12 12c-.905-1.808-3.372-5.194-5.665-6.856"/></svg>` },

];

const norm = u => { try { const x = new URL(u, location.href); return (x.origin + x.pathname).replace(/\/(index\.html)?$/, ''); } catch { return u; } };
const isCurrent = l => l.id === CURRENT || (norm(l.url) === norm(location.href) && (!l.url.includes('#') || l.url.endsWith(location.hash) && location.hash));
const OWN = new Set(TOOLS.map(t => t.url));
const newTab = u => /^https?:/.test(u) && !OWN.has(u);
const ext = u => newTab(u) ? ' target="_blank" rel="noopener"' : '';
const A = (l, cls = '') => {
  const nt = newTab(l.url), c = [cls, nt ? 'ext' : ''].filter(Boolean).join(' ');
  return `<a href="${l.url}"${nt ? ' target="_blank" rel="noopener"' : ''}${isCurrent(l) ? ' aria-current="page"' : ''}${c ? ` class="${c}"` : ''}${l.mark || l.kind ? ` data-key="${l.id}"` : ''}>${l.tiny ? `<img class="tiny" src="${l.tiny}" alt="">` : ''}${l.name}${l.kind ? `<span class="sr">, ${l.kind}</span>` : ''}${nt ? '<span class="sr"> (opens in a new tab)</span>' : ''}</a>`;
};
const WL = () => `<a class="wl" href="${HOME}" target="_blank" rel="noopener">WarLore</a>`;

const toTop = `onclick="window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})"`;

      </div>
      <div class="band"><div class="reveal" aria-hidden="true"></div></div>
      <nav class="tools" aria-label="WarLore tools">${TOOLS.map(t => A(t)).join('')}${A(ALL_TOOLS)}</nav>

      <div class="base">
        <nav aria-label="Wikis">${WIKIS.map(w => A(w, 'own')).join('')}</nav>

  ['Kuba (option 5 on the page)', 'https://www.footer.design/sites/kuba', () => `

    <footer class="xc"><div class="grid">

        ${WL()}
        <div class="line">${TOOLS.map(t => A(t)).join('<span class="sep">/</span>')}</div>
        <div class="line">${[...WIKIS, ...WORK].map(l => A(l)).join('<span class="sep">/</span>')}<span class="sep">/</span><a href="mailto:${EMAIL}">Feedback</a></div>
        <div class="tiles">${CHANNELS.map(c => `<a class="tile${c.id === 'youtube' ? ' yt' : ''}" href="${c.url}" target="_blank" rel="noopener"><span>${c.name}<small>${c.handle}</small></span>${ARROW}</a>`).join('')}</div>
      </div>
      <div class="clock" aria-hidden="true">${Array.from({length:12},(_, i) => `<i style="transform:rotate(${i*30}deg)"></i>`).join('')}<b class="h"></b><b class="m"></b><b class="s"></b></div>
      <div class="photo"><img src="${ART}" alt=""></div>
    </div></footer>`],
];

if (new URLSearchParams(location.search).get('only') === 'hh') FOOTERS.splice(1);
document.getElementById('gallery').innerHTML = FOOTERS.map(([name, url, render]) =>
  (new URLSearchParams(location.search).get('only') ? '' : `<p class="src"><a href="${url}" target="_blank" rel="noopener">${name}</a></p>`) + render()).join('');

const tick = () => {
  const d = new Date(), s = d.getSeconds(), m = d.getMinutes() + s / 60, h = d.getHours() % 12 + m / 60;
  document.querySelectorAll('.xc .clock').forEach(c => {
    c.querySelector('.h').style.transform = `rotate(${h * 30}deg)`;
    c.querySelector('.m').style.transform = `rotate(${m * 6}deg)`;
    c.querySelector('.s').style.transform = `rotate(${s * 6}deg)`;
  });
};
tick(); setInterval(tick, 1000);

/* Hover or focus a tool or wiki: its logo (greyed) or Osprey-blue title appears in the empty band, with what the link is. */
const ALL_LINKS = [...TOOLS, ALL_TOOLS, ...WIKIS];
document.querySelectorAll('.hh').forEach(ft => {
  const box = ft.querySelector('.reveal'); if (!box) return;
  let hideT;
  const show = key => {
    const l = ALL_LINKS.find(x => x.id === key); if (!l) return;
    clearTimeout(hideT);
    const [type, val] = (l.mark || ':').split(/:(.*)/s);
    const mark = type === 'logo' ? `<img src="${val}" alt="">` : type === 'osprey' ? `<i class="osp">${val}</i>` : '';
    /* skip the name when the mark already spells it (Osprey title, or the game's own logo) */
    const spelled = type === 'osprey' || ['dropfleet', 'dropzone', 'warcrow'].includes(l.id);
    box.innerHTML = `${mark}<div>${spelled ? '' : `<b>${l.full || l.name}</b>`}<span>${l.kind || ''}</span></div>`;
    box.classList.add('on');
  };
  const hide = () => { hideT = setTimeout(() => box.classList.remove('on'), 120); };
  ft.querySelectorAll('[data-key]').forEach(a => {
    a.addEventListener('mouseenter', () => show(a.dataset.key));
    a.addEventListener('focus', () => show(a.dataset.key));
    a.addEventListener('mouseleave', hide);
    a.addEventListener('blur', hide);
  });
  const pin = new URLSearchParams(location.search).get('show');
  if (pin) show(pin);
});

/* Footer photos: start on a random one, crossfade to the next every 8 seconds. Motion-sensitive viewers keep one still photo. */
const BGS = ['01-purple-dm-4k','02-green-blue-dm-4k','03-blue-purple-dm-4k','04-pink-orange-dm-4k','05-orange-dm-4k','06-yellow-dm-4k','wip-dark','wip-dark-full'].map(n => `_bg/${n}.webp`);
document.querySelectorAll('.hh .bgs').forEach(box => {
  const [a, b] = box.querySelectorAll('i');
  let n = Math.floor(Math.random() * BGS.length), front = a;
  a.style.backgroundImage = `url(${BGS[n]})`; a.classList.add('on');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  BGS.forEach(src => { const im = new Image(); im.src = src; });
  setInterval(() => {
    n = (n + 1) % BGS.length;
    const back = front === a ? b : a;
    back.style.backgroundImage = `url(${BGS[n]})`;
    back.classList.add('on'); front.classList.remove('on'); front = back;
  }, 8000);
});

</script>
</body>
</html>
