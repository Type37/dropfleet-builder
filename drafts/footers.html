<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WarLore footers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&family=Roboto+Slab:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"TG Open";src:url("../assets/fonts/terminal-grotesque-open.woff2") format("woff2");font-display:swap}
:root{
  --amber:#FFCC00; --black:#000; --teal:#16E0BD; --pink:#EF476F;
  --paper:#F1ECE1; --ink:#1C1A17; --ink2:#55514A;
  --body:"Jost",system-ui,sans-serif; --slab:"Roboto Slab",Georgia,serif; --mono:"VT323",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:var(--body)}
a{color:inherit;text-decoration:none}
footer a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.src{font:500 1rem/1.3 var(--body);margin:56px 20px 12px}
.src:first-child{margin-top:20px}
.src a{text-decoration:underline}

/* WarLore wordmark: gold on black, invert on hover */
.wl{display:inline-block;background:var(--black);color:var(--amber);font-family:"TG Open",var(--mono);line-height:.88;padding:.05em .12em}
.wl:hover,.wl:focus-visible{background:var(--amber);color:var(--black)}
.wl.giant{display:block;text-align:center;font-size:clamp(3rem,21vw,24rem)}

[aria-current="page"]{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.w{max-width:1280px;margin:0 auto;padding:24px}

/* 1 The Design Society: floating link windows over pixel type, ticker */
.s1{background:var(--teal);color:var(--black);position:relative;overflow:clip}
.s1 .stage{position:relative;padding:40px 24px 24px;max-width:1280px;margin:0 auto}
.s1 .win{position:absolute;z-index:2;background:var(--paper);box-shadow:4px 4px 0 var(--black);padding:10px 14px 12px;min-width:220px;font:1.35rem/1.15 var(--mono)}
.s1 .win h3{display:flex;justify-content:space-between;margin:0 0 8px;font:1.35rem/1 var(--mono)}
.s1 .win a{display:block}
.s1 .win a::before{content:"["}.s1 .win a::after{content:"]"}
.s1 .win a:hover{background:var(--black);color:var(--amber)}
.s1 .win.a{top:24px;left:6%}
.s1 .win.b{bottom:18%;right:6%}
.s1 .wl.giant{margin:60px 0 20px}
.s1 .tick{overflow:hidden;background:var(--black);color:var(--paper);font:1.3rem/1.6 var(--mono)}
.s1 .tick div{display:flex;gap:2rem;width:max-content;animation:tick 45s linear infinite}
@keyframes tick{to{transform:translateX(-50%)}}
@media (max-width:760px){.s1 .win{position:static;margin:0 0 12px}.s1 .wl.giant{margin:12px 0}}

/* 2 Outway: colour field, link columns, giant word at the base */
.s2{background:var(--amber);color:var(--black)}
.s2 .w{display:grid;grid-template-columns:1.3fr repeat(2,1fr);gap:24px;padding-top:36px}
.s2 .brand .wl{font-size:3rem}
.s2 h3{margin:0 0 14px;font:1.4rem/1 var(--mono)}
.s2 li{list-style:none;margin:0 0 10px;font:1.25rem/1.1 var(--mono)}
.s2 ul{margin:0;padding:0}
.s2 li a:hover{background:var(--black);color:var(--amber)}
.s2 .wl.giant{margin-top:24px}
@media (max-width:720px){.s2 .w{grid-template-columns:1fr 1fr}.s2 .brand{grid-column:span 2}}

/* 3 Linear Festivals: big nav words spread across, giant word below */
.s3{background:var(--paper)}
.s3 .big{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 28px;font:700 clamp(1.4rem,3.2vw,2.6rem)/1.1 var(--body)}
.s3 .big a:hover{color:var(--ink2)}
.s3 .meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;margin:28px 0 36px;font:500 1rem/1.3 var(--body)}
.s3 .meta nav{display:flex;flex-wrap:wrap;gap:6px 22px}
.s3 .meta a:hover{text-decoration:underline}

/* 4 ggdesign: checker strip, giant type, thin base row */
.s4{background:var(--black);color:var(--paper)}
.s4 .check{height:36px;background:conic-gradient(var(--paper) 25%,var(--black) 0 50%,var(--paper) 0 75%,var(--black) 0) 0 0/36px 36px}
.s4 .tools{display:flex;flex-wrap:wrap;gap:6px 26px;padding:28px 24px 0;max-width:1280px;margin:0 auto;font:500 clamp(1.3rem,2.6vw,2rem)/1.15 var(--slab)}
.s4 .tools a:hover{color:var(--amber)}
.s4 .wl.giant{margin:18px 0}
.s4 .base{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 22px;padding:0 24px 20px;max-width:1280px;margin:0 auto;font:400 1rem/1.3 var(--body)}
.s4 .base nav{display:flex;flex-wrap:wrap;gap:6px 22px}
.s4 .base a:hover{color:var(--amber)}

/* 5 MONOLOG: large stacked nav, side details column, base meta row */
.s5{background:var(--paper)}
.s5 .w{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;padding-top:36px}
.s5 .label{font:1.25rem/1 var(--mono);color:var(--ink2);margin:0 0 14px}
.s5 .stack a{display:block;font:500 clamp(1.8rem,4vw,3.2rem)/1.15 var(--body)}
.s5 .stack a:hover{color:var(--ink2)}
.s5 .side a{display:block;font:500 1.3rem/1.5 var(--body)}
.s5 .side a::after{content:" \2197"}
.s5 .side a:hover{text-decoration:underline}
.s5 .base{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px 24px;margin-top:20px}
.s5 .wl{font-size:2.6rem}
@media (max-width:720px){.s5 .w{grid-template-columns:1fr}}

/* 6 47G: slim bar, mark left, bracket-cornered box and small columns right */
.s6{background:var(--black);color:var(--paper)}
.s6 .w{display:grid;grid-template-columns:auto 1fr auto;gap:20px 40px;align-items:center}
.s6 .wl{font-size:3.6rem}
.s6 .tools{display:flex;flex-wrap:wrap;gap:4px 18px;font:400 1.05rem/1.4 var(--body)}
.s6 .tools a:hover{color:var(--amber)}
.s6 .box{position:relative;padding:12px 18px;font:1.3rem/1.35 var(--mono)}
.s6 .box::before,.s6 .box::after{content:"";position:absolute;inset:0;border:2px solid var(--paper);clip-path:polygon(0 0,14px 0,14px 2px,2px 2px,2px 14px,0 14px,0 calc(100% - 14px),2px calc(100% - 14px),2px calc(100% - 2px),14px calc(100% - 2px),14px 100%,0 100%)}
.s6 .box::after{transform:scaleX(-1)}
.s6 .box h3{margin:0 0 4px;font:1.3rem/1 var(--mono);color:var(--teal)}
.s6 .box a{display:block}
.s6 .box a:hover{color:var(--amber)}
@media (max-width:860px){.s6 .w{grid-template-columns:1fr}.s6 .wl{justify-self:start}}

/* 7 Digital Metal: small links above right, giant word, mono base row */
.s7{background:var(--paper)}
.s7 .top{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px 22px;font:1.3rem/1.1 var(--mono)}
.s7 .top a:hover{background:var(--black);color:var(--amber)}
.s7 .wl.giant{margin:12px 0}
.s7 .base{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 22px;font:1.2rem/1.2 var(--mono);color:var(--ink2)}
.s7 .base nav{display:flex;flex-wrap:wrap;gap:6px 22px}
.s7 .base a{color:var(--ink)}
.s7 .base a:hover{text-decoration:underline}

/* 8 Flexion: labelled columns, generous gap, giant mark, base row */
.s8{background:#fff}
.s8 .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding-bottom:72px}
.s8 h3{margin:0 0 12px;font:1.2rem/1 var(--mono);color:var(--ink2)}
.s8 .cols a{display:block;font:500 1.1rem/1.6 var(--body)}
.s8 .cols a:hover{text-decoration:underline}
.s8 .base{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 20px;margin-top:16px;font:1.15rem/1 var(--mono);color:var(--ink2)}
@media (max-width:640px){.s8 .cols{grid-template-columns:1fr 1fr}.s8 .cols>div:first-child{grid-column:span 2}}

/* 9 Reality Is__: word anchored bottom-left, link columns beside it */
.s9{background:var(--paper)}
.s9 .w{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:28px;align-items:end;padding-top:64px}
.s9 .wl{font-size:clamp(3.5rem,9vw,8rem);justify-self:start}
.s9 h3{margin:0 0 8px;font:700 1rem/1 var(--body)}
.s9 a{display:block;font:500 1rem/1.5 var(--body)}
.s9 a:not(.wl):hover{text-decoration:underline}
.s9 .ext a::after{content:" \2197"}
@media (max-width:760px){.s9 .w{grid-template-columns:1fr 1fr}.s9 .wl{grid-column:span 2}}

/* 10 ++hellohello: top rule, big text left, mark right, full-width action bar */
.s10{background:var(--black);color:var(--paper)}
.s10 .w{padding-top:0}
.s10 .rule{height:4px;background:var(--pink);margin-bottom:24px}
.s10 .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:start;gap:20px}
.s10 .big{display:flex;flex-direction:column;font:700 clamp(1.6rem,4vw,3.2rem)/1.05 var(--body);color:var(--pink)}
.s10 .big a:hover{color:var(--paper)}
.s10 .wl{font-size:clamp(3rem,8vw,6.5rem)}
.s10 .bar{display:flex;justify-content:space-between;align-items:center;margin:48px 0 16px;padding:16px 18px;background:var(--pink);color:var(--black);font:700 1.5rem/1 var(--body)}
.s10 .bar:hover{background:var(--amber)}
.s10 .base{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 22px;font:500 1rem/1.3 var(--body);color:var(--pink)}
.s10 .base nav{display:flex;flex-wrap:wrap;gap:6px 20px}
.s10 .base a:hover{color:var(--paper)}

@media (prefers-reduced-motion:reduce){.s1 .tick div{animation:none}}
</style>
</head>
<body>
<div id="gallery"></div>

<script>
/* One list of links. Add a line here and all ten footers pick it up. */
const CURRENT = 'dropfleet';
const TOOLS = [
  { id:'dropfleet', name:'Dropfleet Commander', url:'https://type37.github.io/dropfleet-builder/' },
  { id:'dropzone',  name:'Dropzone Commander',  url:'https://type37.github.io/dropzone-3e-army-builder/' },
  { id:'abs',       name:'A Billion Suns 2e',   url:'https://type37.github.io/a-billion-suns-shipyard/' },
  { id:'pacific',   name:'Pacific Command',     url:'https://jetwong.neocities.org/wargaming/historicals/pacific-command-builder-2' },
  { id:'dragon',    name:'Dragon Rampant 2e',   url:'https://type37.github.io/dragon-rampant-2e-warband-builder/' },
  { id:'xenos',     name:'Xenos Rampant',       url:'https://type37.github.io/xenos-rampant-force-builder/' },
  { id:'warcrow',   name:'Warcrow',             url:'#' },
];
const CHANNELS = [
  { name:'YouTube',  url:'https://youtube.com/@WarLore' },
  { name:'Patreon',  url:'#' },
  { name:'Ko-fi',    url:'https://ko-fi.com/jetwong' },
];
const FEEDBACK = { name:'Feedback', url:'mailto:warlore1@outlook.com' };
const HOME = 'https://linktr.ee/warlore';

const ext = u => /^https?:/.test(u) ? ' target="_blank" rel="noopener"' : '';
const cur = t => t.id === CURRENT ? ' aria-current="page"' : '';
const T = (fmt = t => t.name) => TOOLS.map(t => `<a href="${t.url}"${cur(t)}>${fmt(t)}</a>`).join('');
const C = (list = CHANNELS) => list.map(c => `<a href="${c.url}"${ext(c.url)}>${c.name}</a>`).join('');
const WL = (cls = '') => `<a class="wl ${cls}" href="${HOME}"${ext(HOME)}>WarLore</a>`;
const short = t => t.name.replace(/ Commander$| 2e$/, '');
const ALL = [...CHANNELS, FEEDBACK];

const FOOTERS = [
  ['The Design Society', 'https://www.footer.design/sites/the-design-society', () => `
    <footer class="s1"><div class="stage">
      <nav class="win a"><h3>Tools <span>[+]</span></h3>${T(short)}</nav>
      <nav class="win b"><h3>Channels <span>[+]</span></h3>${C(ALL)}</nav>
      ${WL('giant')}
    </div><div class="tick" aria-hidden="true"><div>${[...TOOLS, ...TOOLS].map(t => `<span>${t.name} &#10022;</span>`).join('')}</div></div></footer>`],

  ['Outway', 'https://www.footer.design/sites/outway', () => `
    <footer class="s2"><div class="w">
      <div class="brand">${WL()}</div>
      <div><h3>Tools</h3><ul>${TOOLS.map(t => `<li><a href="${t.url}"${cur(t)}>${t.name}</a></li>`).join('')}</ul></div>
      <div><h3>Channels</h3><ul>${ALL.map(c => `<li><a href="${c.url}"${ext(c.url)}>${c.name}</a></li>`).join('')}</ul></div>
    </div>${WL('giant')}</footer>`],

  ['Linear Festivals', 'https://www.footer.design/sites/linear-festivals', () => `
    <footer class="s3"><div class="w">
      <nav class="big">${T(short)}</nav>
      <div class="meta"><nav>${C(ALL)}</nav><span>Unofficial</span></div>
    </div>${WL('giant')}</footer>`],

  ['ggdesign', 'https://www.footer.design/sites/ggdesign', () => `
    <footer class="s4"><div class="check" aria-hidden="true"></div>
      <nav class="tools">${T()}</nav>
      ${WL('giant')}
      <div class="base"><span>Unofficial</span><nav>${C(ALL)}</nav></div>
    </footer>`],

  ['MONOLOG', 'https://www.footer.design/sites/monolog', () => `
    <footer class="s5"><div class="w">
      <div><p class="label">Tools</p><nav class="stack">${T()}</nav></div>
      <div class="side"><p class="label">Channels</p>${C(ALL)}</div>
      <div class="base">${WL()}<span>Unofficial</span></div>
    </div></footer>`],

  ['47G', 'https://www.footer.design/sites/47g', () => `
    <footer class="s6"><div class="w">
      ${WL()}
      <nav class="tools">${T()}</nav>
      <nav class="box"><h3>Channels</h3>${C(ALL)}</nav>
    </div></footer>`],

  ['Digital Metal', 'https://www.footer.design/sites/digital-metal', () => `
    <footer class="s7"><div class="w">
      <nav class="top">${T(short)}</nav>
      ${WL('giant')}
      <div class="base"><span>Unofficial</span><nav>${C(ALL)}</nav></div>
    </div></footer>`],

  ['Flexion', 'https://www.footer.design/sites/flexion', () => `
    <footer class="s8"><div class="w">
      <div class="cols">
        <div><h3>Tools</h3>${T()}</div>
        <div><h3>Channels</h3>${C()}</div>
        <div><h3>Contact</h3>${C([FEEDBACK])}</div>
      </div>
      ${WL('giant')}
      <div class="base"><span>Unofficial</span></div>
    </div></footer>`],

  ['Reality Is__', 'https://www.footer.design/sites/reality-is', () => `
    <footer class="s9"><div class="w">
      ${WL()}
      <nav><h3>Tools</h3>${T()}</nav>
      <nav class="ext"><h3>Channels</h3>${C(ALL)}</nav>
    </div></footer>`],

  ['++hellohello', 'https://www.footer.design/sites/hellohello', () => `
    <footer class="s10"><div class="w">
      <div class="rule" aria-hidden="true"></div>
      <div class="head"><nav class="big">${T()}</nav>${WL()}</div>
      <a class="bar" href="${FEEDBACK.url}">${FEEDBACK.name}<span aria-hidden="true">&#8599;</span></a>
      <div class="base"><span>Unofficial</span><nav>${C()}</nav></div>
    </div></footer>`],
];

document.getElementById('gallery').innerHTML = FOOTERS.map(([name, url, render], i) =>
  `<p class="src">${i + 1}. Based on <a href="${url}" target="_blank" rel="noopener">${name}</a></p>${render()}`).join('');
</script>
</body>
</html>
