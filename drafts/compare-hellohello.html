<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hellohello vs WarLore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#2b2b2b;color:#eee;font:500 15px/1.3 "Inter",system-ui,sans-serif;padding:20px}
h2{font:600 17px/1 "Inter",sans-serif;margin:28px 0 12px}
h2:first-child{margin-top:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.col>div{font-weight:600;margin-bottom:8px}
.col img{display:block;width:100%;height:auto}
.frame{position:relative;width:100%;overflow:hidden;background:#000}
.frame iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0}
.mob{grid-template-columns:393px 393px;justify-content:start}
.mob iframe{position:static;width:393px;border:0;background:#000}
@media (max-width:900px){.row{grid-template-columns:1fr}.mob{grid-template-columns:393px}}
</style>
</head>
<body>
<h2>Desktop</h2>
<div class="row">
  <div class="col"><div>hellohello (official)</div><img src="_ref/hellohello-desktop.png" alt="hellohello footer on desktop"></div>
  <div class="col"><div>WarLore</div><div class="frame" data-w="1053"><iframe src="footer-hellohello.html?only=hh" title="WarLore footer, desktop"></iframe></div></div>
</div>

<h2>Phone (393px)</h2>
<div class="row mob">
  <div class="col"><div>hellohello (official)</div><img src="_ref/hellohello-mobile.png" alt="hellohello footer on a phone" style="width:393px"></div>
  <div class="col"><div>WarLore</div><iframe class="m" src="footer-hellohello.html?only=hh" title="WarLore footer, phone"></iframe></div>
</div>

<script>
/* Desktop: render our footer at the original's CSS width (1053px) and scale it to the column, so both sides are the same size. */
const fit = () => document.querySelectorAll('.frame').forEach(fr => {
  const ifr = fr.querySelector('iframe'), W = +fr.dataset.w, k = fr.clientWidth / W;
  ifr.style.width = W + 'px';
  const h = ifr.contentDocument?.querySelector('footer')?.offsetHeight || 700;
  ifr.style.height = h + 'px'; ifr.style.transform = `scale(${k})`; fr.style.height = h * k + 'px';
});
/* Size each frame to its footer, and keep doing so as fonts and images finish loading. */
document.querySelectorAll('iframe').forEach(i => i.addEventListener('load', () => {
  const ft = i.contentDocument.querySelector('footer'); if (!ft) return;
  const sync = () => { if (i.classList.contains('m')) i.style.height = ft.offsetHeight + 'px'; fit(); };
  new i.contentWindow.ResizeObserver(sync).observe(ft);
  i.contentDocument.fonts.ready.then(sync); sync();
}));
addEventListener('resize', fit);
</script>
</body>
</html>
