name: Watch for DFC data changes

# Three independent tripwires, so a stat change cannot land silently:
#
#   scan-dfc-files.py   watches TTCombat's downloads page for a new or re-uploaded
#                       PDF. First to know, but only says "something changed".
#   audit-cards.py      downloads the current stat cards and diffs every cost,
#                       stat and weapon COUNT against data/faction-*.json. The
#                       only one pointed at US rather than upstream, and the only
#                       one that would have caught 66bbad0, where we deleted a
#                       weapon from four Bioficer ships and nothing upstream moved.
#                       Having the bytes, it also hashes them, so an in-place
#                       re-cut under an unchanged URL cannot hide (the 260731
#                       Resistance stats were re-cut exactly that way).
#   gen-fleet-data.py   proves data/fleet-data.json is still a faithful merge of
#                       the faction files. It drifted 19 ships behind once, and a
#                       session then trusted it over the PDF.
#
# None of them edit data. When one fires, Claude integrates the change following
# docs/AUTO-INGEST.md. The same three tripwires then re-run as the gate, plus the
# test suites; only if all pass is the work committed to master, which deploys.
# Jet is emailed (an assigned issue) only when Claude says a decision is needed
# (NEEDS_JET.md), the gate fails, or no Claude token is set. A quiet week and a
# successful automatic ingest send nothing.

on:
  schedule:
    - cron: '39 8 * * 1'   # 08:39 UTC every Monday
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Open a test issue to prove the email path works'
        type: boolean
        default: false
      test_claude:
        description: 'Run Claude once, changing nothing, to prove the token works'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: dfc-data-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      # Both scripts are stdlib-only and exit 1 on findings, 0 when clean, so
      # neither needs installs and neither should fail the job on a finding.
      #
      # The alert gates on the "#findings=N" trailer each report ends with, not
      # on the exit code. An exit code cannot say how many findings there were,
      # and a mail that announces findings it does not list is worse than no
      # mail: #7 and #9 were both that. If the trailer is somehow absent, fall
      # back to the exit code rather than going quiet about a real change.
      - name: TTCombat downloads page
        id: files
        run: |
          set +e
          python scripts/scan-dfc-files.py > files.txt 2>&1
          code=$?
          set -e
          cat files.txt
          if [ "$code" -gt 1 ]; then
            echo "scanner errored with exit $code" >&2
            exit "$code"
          fi
          n=$(sed -n 's/^#findings=//p' files.txt | tail -1)
          sed -i '/^#findings=/d' files.txt
          echo "findings=${n:-$code}" >> "$GITHUB_OUTPUT"

      # audit-cards.py is the one step with dependencies: it parses the PDFs. It
      # reuses the card parser from ingest_pdf.py, which imports Pillow for the art
      # extraction this audit never runs — install it anyway or the import exits.
      - name: Install the PDF parser
        run: pip install --quiet pymupdf pillow

      # Downloads ~60 MB of stat cards each run. That is the price of checking our
      # numbers against the source rather than against another copy of ourselves,
      # which is precisely the shortcut that lost four Bioficer weapons for 25 days.
      - name: Cards vs our data
        id: cards
        run: |
          set +e
          python scripts/audit-cards.py > cards.txt 2>&1
          code=$?
          set -e
          cat cards.txt
          if [ "$code" -gt 1 ]; then
            echo "card audit errored with exit $code" >&2
            exit "$code"
          fi
          n=$(sed -n 's/^#findings=//p' cards.txt | tail -1)
          sed -i '/^#findings=/d' cards.txt
          echo "findings=${n:-$code}" >> "$GITHUB_OUTPUT"

      # Cheap, no network: regenerate the mirror and see whether anything moved.
      # A diff here means someone hand-edited a generated file.
      - name: Mirror is still generated, not hand-patched
        id: mirror
        run: |
          python scripts/gen-fleet-data.py > /dev/null
          if git diff --quiet -- data/fleet-data.json; then
            echo "findings=0" >> "$GITHUB_OUTPUT"
          else
            git --no-pager diff --stat -- data/fleet-data.json | tee mirror.txt
            echo "findings=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Anything to do?
        id: need
        run: |
          if [ "${{ steps.files.outputs.findings }}" != "0" ] || [ "${{ steps.cards.outputs.findings }}" != "0" ] || [ "${{ steps.mirror.outputs.findings }}" != "0" ]; then
            echo "work=true" >> "$GITHUB_OUTPUT"
          else
            echo "work=false" >> "$GITHUB_OUTPUT"
          fi
          git checkout -- data/fleet-data.json   # undo the mirror check's regeneration

      - name: Token check
        if: inputs.test_claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: Read docs/AUTO-INGEST.md and reply with its first heading. Change no files.
          claude_args: --max-turns 3 --allowedTools "Read"
          show_full_output: true

      # Claude reads the new PDFs and does the integration a person used to do from
      # the issue. It does not commit; the gate below decides whether its work ships.
      - name: Integrate with Claude
        id: claude
        if: steps.need.outputs.work == 'true' && env.HAS_CLAUDE == 'true' && !inputs.test_alert
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read docs/AUTO-INGEST.md and do what it says. files.txt and cards.txt in the
            repo root are this week's findings. Before you finish, write ingest-summary.txt:
            a one-line title (under 70 characters), a blank line, then what changed in plain words.
          claude_args: --max-turns 300 --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

      # The same tripwires that found the change must now come back clean, and
      # nothing may break. Each failure is written to gate.txt for the email.
      - name: Check Claude's work
        id: gate
        if: steps.claude.outcome == 'success' || steps.claude.outcome == 'failure'
        run: |
          : > gate.txt
          fail() { echo "- $1" >> gate.txt; }
          [ "${{ steps.claude.outcome }}" = "success" ] || fail "The Claude step itself failed; see the run log."
          [ -f NEEDS_JET.md ] && fail "Claude asked for a decision (below)."
          [ -f ingest-summary.txt ] || fail "No ingest-summary.txt, so Claude did not finish."
          python scripts/scan-dfc-files.py > scan2.txt 2>&1 || true
          grep -q '^#findings=0' scan2.txt || { fail "The downloads scan still reports changes:"; sed '/^#findings/d' scan2.txt >> gate.txt; }
          python scripts/audit-cards.py > cards2.txt 2>&1 || true
          grep -q '^#findings=0' cards2.txt || { fail "The card audit still disagrees with the data:"; sed '/^#findings/d' cards2.txt | tail -25 >> gate.txt; }
          cp data/fleet-data.json /tmp/mirror.json
          python scripts/gen-fleet-data.py > /dev/null
          cmp -s data/fleet-data.json /tmp/mirror.json || fail "data/fleet-data.json was not regenerated from the faction files."
          for f in js/app.js mobile/js/mobile.js; do node --check "$f" 2>> gate.txt || fail "$f does not parse."; done
          for t in test-calc-data test-calc-engine test-calc-rules test-fleet-sync; do
            node "scripts/$t.mjs" > t.txt 2>&1 || { fail "scripts/$t.mjs failed:"; tail -15 t.txt >> gate.txt; }
          done
          if [ -s gate.txt ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; cat gate.txt; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - name: Commit and deploy
        if: steps.gate.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { cat ingest-summary.txt; printf '\n\nAutomatic: found by the weekly scan, integrated by Claude following\ndocs/AUTO-INGEST.md, and committed because the downloads scan, card audit,\nmirror check and test suites all passed afterwards.\n'; } > msg.txt
          rm -f ingest-summary.txt files.txt cards.txt mirror.txt scan2.txt cards2.txt gate.txt t.txt msg.txt.bak
          git add -A data assets js mobile scenarios scripts sw.js CHANGELOG.md
          git diff --cached --quiet && { echo "Nothing changed."; exit 0; }
          git commit -F msg.txt
          git push

      # An open alert from an earlier week is answered by this commit; close it.
      - name: Close the old alert
        if: steps.gate.outputs.ok == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'dfc-data' });
            for (const i of open)
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed', state_reason: 'completed' });

      - name: Report
        if: (steps.need.outputs.work == 'true' && steps.gate.outputs.ok != 'true') || inputs.test_alert
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const read = f => fs.readFileSync(f, 'utf8').trim();
            const isTest = ${{ inputs.test_alert || false }};
            const parts = isTest
              ? ['**Test alert.** Nothing is wrong; this only proves the email path works. Close it.', '']
              : ['The Dropfleet data needs a look.', ''];

            if (!isTest) {
              const has = f => fs.existsSync(f) && fs.statSync(f).size > 0;
              if (process.env.HAS_CLAUDE !== 'true') {
                parts.push('Nothing was integrated automatically: the repo has no `CLAUDE_CODE_OAUTH_TOKEN` secret.', '');
              } else {
                parts.push('## Claude tried, and stopped here', '');
                if (has('NEEDS_JET.md')) parts.push(read('NEEDS_JET.md'), '');
                if (has('gate.txt')) parts.push('Checks that did not pass:', '', '```', read('gate.txt'), '```', '');
                parts.push('Nothing was committed. The findings that started it are below.', '');
              }
            }

            const files = Number('${{ steps.files.outputs.findings }}' || 0);
            const cards = Number('${{ steps.cards.outputs.findings }}' || 0);
            const mirror = Number('${{ steps.mirror.outputs.findings }}' || 0);

            if (files) {
              parts.push(`## TTCombat published something (${files})`, '', '```', read('files.txt'), '```', '');
            }
            if (cards) {
              parts.push(`## The cards and our data disagree (${cards})`, '',
                'This one is about us, not TTCombat. Either a ship drifted from its card,',
                'or a card was re-cut in place under an unchanged URL.',
                '',
                'Open the PDF and read the block. If the data is wrong, fix it. If the parser',
                'is wrong, confirm it against the card and move the line into `accepted` in',
                '`scripts/card-audit-baseline.json` — that bucket is a claim someone read it.',
                '', '```', read('cards.txt'), '```', '');
            }
            if (mirror) {
              parts.push('## `data/fleet-data.json` was hand-edited', '',
                'It is generated. Regenerating it changed it, which means an edit went into',
                'the mirror instead of into the `faction-*.json` file the app actually loads —',
                'so the edit is not live, and the mirror now disagrees with the app.',
                '',
                'Put the change in the faction file, then run `python scripts/gen-fleet-data.py`.',
                '', '```', read('mirror.txt'), '```', '');
            }
            parts.push(
              '---',
              'Integrating an edition: download the PDFs into `Rules-Mechanics-PDFs/`, diff them',
              'page by page against the previous edition, update `data/faction-*.json`, and check',
              'whether any new rule changes what is LEGAL to take. If it does, wire it into both',
              '`js/app.js` and `mobile/js/mobile.js`, not just the card text. Then rebaseline with',
              '`python scripts/scan-dfc-files.py --update`.',
              '',
              'A `REVISED` entry means the same date stamp was re-uploaded. Usually cosmetic, but',
              'not always: on 2026-08-02 a re-upload renamed a ship, so diff the text before',
              'assuming nothing changed.',
              '',
              `_[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
            );
            const body = parts.join('\n');

            // One open issue at a time. If the last one is still open the change
            // has not been dealt with, so comment rather than pile up.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'dfc-data',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
            } else {
              // Assign the repo owner: GitHub emails on assignment under the
              // default "Participating and @mentions" setting, whereas an issue
              // merely opened by the Actions bot would not reach the inbox.
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: (isTest ? 'Test alert' : 'Dropfleet data changed')
                  + ` (${new Date().toISOString().slice(0, 10)})`,
                labels: ['dfc-data'],
                assignees: [context.repo.owner],
                body,
              });
              core.notice(`Opened #${issue.number}: ${issue.html_url}`);
            }
