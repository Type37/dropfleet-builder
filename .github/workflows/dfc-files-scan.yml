name: Watch for DFC data changes

# The weekly Dropfleet update. The same process as the Dropzone builder's:
#
#   1. scripts/auto-update.py   asks TTCombat's downloads page what changed, downloads
#                               only those sheets (to a temporary folder, never kept),
#                               compares them card by card with scripts/card-snapshots.json
#                               and writes new and changed ships, art, the What's New
#                               entry and the "Updated <month> with <file>" line.
#   2. Claude (Sonnet)          only for the cards or documents the script listed as
#                               unfamiliar (a new keyword, an odd layout), one at a time,
#                               and for any drift the card audit finds.
#   3. The gate                 the downloads scan, the card audit (our data against
#                               TTCombat's current cards), the mirror check and the test
#                               suites. Only work that passes all of them is committed;
#                               the commit deploys.
#   4. Email                    only when the gate fails, Claude says a person must
#                               decide (NEEDS_JET.md), or a ship or file vanished.
#                               A quiet week and a successful update send nothing.

on:
  schedule:
    - cron: '39 8 * * 1'   # 08:39 UTC every Monday
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Open a test issue to prove the email path works'
        type: boolean
        default: false
      test_claude:
        description: 'Run Claude once, changing nothing, to prove the token works'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: dfc-data-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Install the PDF reader
        run: pip install --quiet pymupdf pillow

      # A test, so it never fails the run (a failed run emails Jet).
      - name: Token check
        id: tokencheck
        if: inputs.test_claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: Read docs/AUTO-INGEST.md and reply with its first heading. Change no files.
          claude_args: --max-turns 3 --model claude-sonnet-5-5 --allowedTools "Read"
          show_full_output: true

      - name: Token check result
        if: inputs.test_claude
        run: |
          if [ "${{ steps.tokencheck.outcome }}" = "success" ]; then
            echo "### Claude token works" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Claude token was rejected" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 0 done or nothing new, 10 some cards need Claude, 20 a person must decide,
      # anything else: the script broke (that is a gate failure, so it emails).
      - name: Update from TTCombat
        id: update
        if: ${{ !inputs.test_alert && !inputs.test_claude }}
        run: |
          set +e
          python scripts/auto-update.py > update.txt 2>&1
          code=$?
          set -e
          cat update.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # Our data against TTCombat's current cards, and the generated mirror against
      # the faction files. Drift here is for Claude first, then for the gate.
      - name: Cards and mirror
        id: pre
        if: steps.update.outcome == 'success'
        run: |
          : > pre.txt
          python scripts/audit-cards.py > cards.txt 2>&1 || true
          grep -q '^#findings=0' cards.txt || { echo "The card audit disagrees with our data:" >> pre.txt; sed '/^#findings/d' cards.txt | tail -25 >> pre.txt; }
          cp data/fleet-data.json /tmp/mirror.json
          python scripts/gen-fleet-data.py > /dev/null
          cmp -s data/fleet-data.json /tmp/mirror.json || echo "data/fleet-data.json had been edited by hand; it was regenerated." >> pre.txt
          if [ -s pre.txt ]; then echo "drift=true" >> "$GITHUB_OUTPUT"; cat pre.txt; else echo "drift=false" >> "$GITHUB_OUTPUT"; fi

      - name: Claude, for what the script could not do
        id: claude
        if: env.HAS_CLAUDE == 'true' && (steps.update.outputs.code == '10' || steps.pre.outputs.drift == 'true')
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read docs/AUTO-INGEST.md and do what it says. The script's report is
            auto-update-report.json (its "claude" list is your work); pre.txt, if not
            empty, lists drift between our data and TTCombat's cards.
          claude_args: --max-turns 80 --model claude-sonnet-5-5 --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

      - name: Check the work
        id: gate
        if: steps.update.outcome == 'success' && (steps.update.outputs.code != '0' || steps.pre.outputs.drift == 'true' || hashFiles('auto-update-report.json') != '')
        run: |
          : > gate.txt
          fail() { echo "- $1" >> gate.txt; }
          code="${{ steps.update.outputs.code }}"
          case "$code" in
            0|10) ;;
            20) fail "The update needs a decision:"; python -c "import json; [print('  ' + p) for p in json.load(open('auto-update-report.json'))['person']]" >> gate.txt ;;
            *) fail "scripts/auto-update.py stopped with exit $code:"; tail -20 update.txt >> gate.txt ;;
          esac
          if [ "$code" = "10" ] || [ "${{ steps.pre.outputs.drift }}" = "true" ]; then
            [ "$HAS_CLAUDE" = "true" ] || fail "Some cards need Claude, but the repo has no CLAUDE_CODE_OAUTH_TOKEN secret."
            [ "${{ steps.claude.outcome }}" = "success" ] || [ "$HAS_CLAUDE" != "true" ] || fail "The Claude step failed; see the run log."
          fi
          [ -f NEEDS_JET.md ] && fail "Claude asked for a decision (below)."
          python scripts/scan-dfc-files.py > scan2.txt 2>&1 || true
          grep -q '^#findings=0' scan2.txt || { fail "The downloads scan still reports changes:"; sed '/^#findings/d' scan2.txt >> gate.txt; }
          python scripts/audit-cards.py > cards2.txt 2>&1 || true
          grep -q '^#findings=0' cards2.txt || { fail "The card audit still disagrees with the data:"; sed '/^#findings/d' cards2.txt | tail -25 >> gate.txt; }
          cp data/fleet-data.json /tmp/mirror.json
          python scripts/gen-fleet-data.py > /dev/null
          cmp -s data/fleet-data.json /tmp/mirror.json || fail "data/fleet-data.json does not match the faction files."
          for f in js/app.js mobile/js/mobile.js; do node --check "$f" 2>> gate.txt || fail "$f does not parse."; done
          for t in test-calc-data test-calc-engine test-calc-rules test-fleet-sync; do
            node "scripts/$t.mjs" > t.txt 2>&1 || { fail "scripts/$t.mjs failed:"; tail -15 t.txt >> gate.txt; }
          done
          if [ -s gate.txt ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; cat gate.txt; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - name: Commit and deploy
        if: steps.gate.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json, os
          r = json.load(open('auto-update-report.json')) if os.path.exists('auto-update-report.json') else {}
          files = r.get('files') or []
          title = 'TTCombat update: ' + ', '.join(f.rsplit('.', 1)[0] for f in files) if files else 'Data brought back in line with the cards'
          body = [title, ''] + ['- ' + c for c in r.get('changelog', [])]
          if r.get('claude'):
              body += ['', 'Claude handled: ' + ', '.join(c.get('ship') or c.get('pdf') for c in r['claude']) + '.']
          body += ['', 'Automatic. Committed because the downloads scan, card audit, mirror check',
                   'and test suites all passed afterwards.']
          open('msg.txt', 'w').write('\n'.join(body) + '\n')
          PY
          rm -f auto-update-report.json update.txt pre.txt cards.txt scan2.txt cards2.txt gate.txt t.txt
          git add -A data assets js mobile scenarios scripts sw.js CHANGELOG.md
          git diff --cached --quiet && { echo "Nothing changed."; exit 0; }
          git commit -F msg.txt
          git push

      # An open alert from an earlier week is answered by this commit; close it.
      - name: Close the old alert
        if: steps.gate.outputs.ok == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'dfc-data' });
            for (const i of open)
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed', state_reason: 'completed' });

      - name: Email Jet
        if: steps.gate.outputs.ok == 'false' || inputs.test_alert
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const has = f => fs.existsSync(f) && fs.statSync(f).size > 0;
            const read = f => fs.readFileSync(f, 'utf8').trim();
            const isTest = ${{ inputs.test_alert || false }};
            const parts = isTest
              ? ['**Test alert.** Nothing is wrong; this only proves the email path works. Close it.', '']
              : ['The weekly Dropfleet update could not finish on its own. Nothing was committed; the site still has last week\'s data.', ''];
            if (!isTest) {
              if (has('NEEDS_JET.md')) parts.push('## What Claude needs you to decide', '', read('NEEDS_JET.md'), '');
              if (has('gate.txt')) parts.push('## What did not pass', '', '```', read('gate.txt'), '```', '');
              if (has('update.txt')) parts.push('## What the script did', '', '```', read('update.txt').slice(-4000), '```', '');
            }
            parts.push(`_[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`);
            const body = parts.join('\n');
            // One open issue at a time; a still-open one gets a comment instead.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'dfc-data' });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body });
            } else {
              // Assigning the owner is what makes GitHub email it.
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: (isTest ? 'Test alert' : 'Dropfleet update needs you') + ` (${new Date().toISOString().slice(0, 10)})`,
                labels: ['dfc-data'], assignees: [context.repo.owner], body });
              core.notice(`Opened #${issue.number}: ${issue.html_url}`);
            }
