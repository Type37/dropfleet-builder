name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # A push made with GITHUB_TOKEN starts no workflow, so the watcher's automatic
  # ingest would land on master and go nowhere. workflow_run brings it back in.
  workflow_run:
    workflows: ["Watch for DFC data changes"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments. When pushes land close together, the newer queued run
# supersedes the older queued one (which is skipped, not failed), while the
# in-progress deployment is allowed to finish. This stops the "Deployment
# failed, try again later" collisions that the legacy Pages builder produced.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # After a watcher run only if it succeeded. A quiet week redeploys the same
    # site, which costs a minute and nothing else.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # The whole repo root is the site (static HTML/JS/CSS/data).
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
